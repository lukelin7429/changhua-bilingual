<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival 06 Quiz · World Book Day · Festival English Series</title>
<meta name="description" content="Festival 06 Quiz — World Book Day. 12 questions on origins, reading vocabulary, classroom activities, and roleplay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cane:#5b9c3f;--cane-deep:#316821;--cane-soft:#e3f1d6;
    --gold:#c89a3a;--gold-deep:#8a6818;--gold-soft:#f6e8c4;
    --terra:#b85f33;--terra-deep:#834020;--terra-soft:#f5dac9;
    --sky:#4a90b8;--sky-deep:#2b6789;--sky-soft:#dfecf4;
    --ink:#2a2725;--ink-soft:#5a564f;--line:#e3e2d6;--bg-soft:#faf6ea;
    --shadow:0 14px 38px -16px rgba(49,104,33,.30);
    --shadow-sm:0 6px 16px -6px rgba(49,104,33,.18);
    --max:1140px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:21px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  @media(min-width:720px){body{font-size:23px;}}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}
  img{max-width:100%;display:block;}
  a{color:var(--cane-deep);text-decoration:none;transition:color .2s;}
  a:hover{color:var(--terra);}
  .serif{font-family:'Cormorant Garamond','PingFang TC',serif;}

  /* ===== Topbar ===== */
  .topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:9px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .brand-name{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:21px;font-weight:700;color:var(--cane-deep);line-height:1.1;}
  .brand-name small{display:block;font-family:'PingFang TC',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);margin-top:2px;letter-spacing:.04em;}
  .topbar-nav{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .topbar-nav a{color:var(--ink);font-size:18.5px;font-weight:500;letter-spacing:.02em;padding:9px 14px;border-radius:9px;line-height:1.2;transition:background .15s,color .15s;}
  .topbar-nav a:hover{color:var(--cane-deep);background:var(--cane-soft);}
  .topbar-nav a.is-active{color:var(--cane-deep);font-weight:700;background:var(--cane-soft);}
  @media(max-width:820px){.topbar-inner{flex-direction:column;align-items:stretch;gap:6px;}.topbar-nav{gap:4px;justify-content:flex-start;width:100%;}.topbar-nav a{padding:10px 13px;font-size:18px;}.brand img{width:40px;height:40px;}}

  /* ===== Photo banner ===== */
  .pbanner{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(340px,48vh,520px);text-align:center;color:#fff;border-bottom:5px solid var(--gold);padding:64px 24px 46px;background-size:cover;background-position:center 50%;}
  @media(min-width:720px){.pbanner{min-height:clamp(400px,56vh,580px);padding:88px 24px 58px;}}
  .pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,40,18,.06) 0%,rgba(20,40,18,0) 38%,rgba(20,40,18,.5) 74%,rgba(15,32,16,.88) 100%);}
  .pbanner>.bn{position:relative;z-index:1;}
  .pbanner .eyebrow{display:inline-block;font-size:16px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:12px;text-shadow:0 1px 8px rgba(0,0,0,.6);}
  .pbanner h1{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(40px,6.6vw,68px);font-weight:700;line-height:1.06;text-shadow:0 2px 20px rgba(0,0,0,.6);}
  .pbanner h1 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:clamp(18px,2.4vw,25px);color:rgba(255,255,255,.95);font-weight:500;margin-top:11px;letter-spacing:.06em;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  .pbanner .bdiv{width:60px;height:2px;background:var(--gold);border:0;margin:20px auto 16px;}
  .pbanner .lede{max-width:680px;margin:0 auto;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2.2vw,22px);color:rgba(255,255,255,.96);line-height:1.5;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  .pbanner .lede .zh{display:block;font-style:normal;font-family:'PingFang TC',sans-serif;font-size:19px;margin-top:8px;color:rgba(255,255,255,.9);}
  .factstrip{display:flex;flex-wrap:wrap;justify-content:center;gap:0;max-width:780px;margin:26px auto 0;position:relative;z-index:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:14px;backdrop-filter:blur(6px);overflow:hidden;}
  .fact{flex:1 1 165px;padding:16px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.16);}
  .fact:last-child{border-right:0;}
  .fact .fe{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);}
  .fact .fz{font-size:15.5px;margin-top:5px;color:var(--gold-soft);font-family:'PingFang TC',sans-serif;}
  @media(max-width:640px){.fact{flex:1 1 45%;border-bottom:1px solid rgba(255,255,255,.14);}.fact:nth-child(2n){border-right:0;}}

  /* ===== Sections ===== */
  section{padding:72px 0;}
  .sec-head{text-align:center;margin-bottom:46px;}
  .sec-head .eyebrow{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px;color:var(--cane);}
  .sec-head h2{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(33px,5vw,52px);font-weight:700;color:var(--cane-deep);line-height:1.18;}
  .sec-head h2 .zh{font-family:'PingFang TC',sans-serif;font-size:20px;color:var(--ink-soft);font-weight:500;display:block;margin-top:6px;letter-spacing:.04em;}
  .sec-head .lede{color:var(--ink-soft);font-size:20px;max-width:680px;margin:16px auto 0;line-height:1.7;}

  /* ===== About ===== */
  .about-grid{display:grid;grid-template-columns:1fr;gap:40px;align-items:start;}
  @media(min-width:880px){.about-grid{grid-template-columns:1fr 1.05fr;gap:50px;}}
  .about-photos{display:grid;gap:14px;}
  .about-photo{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .about-photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;}
  .about-photo .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(15,32,18,.86),transparent);color:#fff;padding:18px 16px 12px;font-family:'PingFang TC',sans-serif;font-size:17px;}
  .about-photo .cap .en{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;margin-bottom:2px;}
  .about-text h3{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(27px,4vw,37px);color:var(--cane-deep);line-height:1.28;margin-bottom:16px;font-weight:700;}
  .about-text p{font-size:20px;color:var(--ink);margin-bottom:14px;line-height:1.7;}
  .about-text .zh{font-family:'PingFang TC',sans-serif;font-size:19.5px;color:var(--ink);line-height:1.85;}
  .about-text strong{color:var(--cane-deep);}
  .about-text .zhd{height:1px;background:var(--line);margin:22px 0;}
  .quick{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:22px;}
  .quick dt{font-size:15px;font-weight:700;color:var(--cane);letter-spacing:.12em;text-transform:uppercase;margin-top:10px;}
  .quick dt:first-child{margin-top:0;}
  .quick dd{font-size:19px;color:var(--ink);margin:2px 0 6px;font-family:'PingFang TC',sans-serif;}

  /* ===== Five Ing Pillars ===== */
  .pillars{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:720px){.pillars{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1040px){.pillars{grid-template-columns:repeat(5,1fr);}}
  .pillar{background:#fff;border-radius:16px;padding:26px 22px;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s;border-top:6px solid var(--cane);text-align:center;}
  .pillar:nth-child(2){border-top-color:var(--gold);}
  .pillar:nth-child(3){border-top-color:var(--terra);}
  .pillar:nth-child(4){border-top-color:var(--sky);}
  .pillar:nth-child(5){border-top-color:var(--cane-deep);}
  .pillar:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .pillar .icon{font-size:36px;margin-bottom:12px;line-height:1;}
  .pillar h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--cane-deep);font-weight:700;line-height:1.2;}
  .pillar h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:16px;color:var(--ink-soft);font-weight:500;margin-top:4px;}
  .pillar p{font-size:17px;color:var(--ink-soft);margin-top:12px;line-height:1.55;}

  /* ===== Video tour (horizontal 16:9 intro) ===== */
  .vtour{display:grid;grid-template-columns:1fr;gap:32px;align-items:center;}
  @media(min-width:880px){.vtour{grid-template-columns:1.15fr .85fr;gap:48px;}}
  .vembed{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:var(--shadow);border:4px solid #fff;}
  .vembed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .vtour__text .kick{display:inline-block;color:var(--terra-deep);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:15.5px;}
  .vtour__text h2{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(30px,4.6vw,44px);color:var(--cane-deep);font-weight:700;margin-top:8px;line-height:1.16;}
  .vtour__text h2 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:20px;color:var(--ink-soft);font-weight:500;margin-top:6px;}
  .vtour__text p{font-size:19px;color:var(--ink);margin-top:14px;line-height:1.7;}
  .vtour__text p .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:18.5px;color:var(--ink-soft);margin-top:8px;}
  .vtour__links{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;}
  .vtour__link{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;background:#fff;border:1.5px solid var(--line);border-radius:11px;color:var(--cane-deep);font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;transition:all .2s;}
  .vtour__link:hover{transform:translateY(-2px);border-color:var(--cane);color:var(--cane-deep);}
  .vtour__link .ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:18px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;}
  .vtour__link .ic.yt{background:#FF0000;}
  .vtour__link .ic.sc{background:#FF5500;}

  /* ===== Feature card ===== */
  .feat{position:relative;display:grid;grid-template-columns:1fr;gap:28px;align-items:center;background:linear-gradient(135deg,var(--cane-soft) 0%,var(--gold-soft) 100%);border:1px solid var(--line);border-radius:24px;padding:32px 30px;box-shadow:var(--shadow);overflow:hidden;}
  @media(min-width:860px){.feat{grid-template-columns:1.05fr .95fr;gap:42px;padding:44px 46px;}}
  .feat .kick{display:inline-block;color:var(--terra-deep);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:16px;}
  .feat h2{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(31px,5vw,46px);color:var(--cane-deep);font-weight:700;margin-top:8px;line-height:1.12;}
  .feat h2 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:22px;color:var(--ink-soft);font-weight:500;margin-top:6px;}
  .feat p{font-size:20px;color:var(--ink);margin-top:16px;line-height:1.7;}
  .feat p .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:19px;color:var(--ink-soft);margin-top:8px;}
  .feat .pts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;}
  .feat .pt{font-size:16px;font-weight:600;padding:8px 15px;border-radius:22px;background:#fff;color:var(--cane-deep);border:1px solid var(--line);}
  .feat img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;box-shadow:var(--shadow);}

  /* ===== Campus life cards ===== */
  .life-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:560px){.life-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:880px){.life-grid{grid-template-columns:repeat(4,1fr);}}
  .life-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s;}
  .life-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .life-card__img{aspect-ratio:4/3;overflow:hidden;background:var(--cane-soft);}
  .life-card__img img{width:100%;height:100%;object-fit:cover;}
  .life-card__b{padding:16px 18px 20px;}
  .life-card h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--cane-deep);font-weight:700;}
  .life-card h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:16px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .ctr{text-align:center;margin-top:38px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--cane-deep);color:#fff;padding:15px 30px;border-radius:13px;font-weight:700;font-size:20px;font-family:'Cormorant Garamond',serif;transition:background .2s,transform .2s;}

  /* ===== News teaser ===== */
  .story-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:760px){.story-grid{grid-template-columns:repeat(3,1fr);}}
  .story{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s;display:block;color:inherit;}
  .story:hover{transform:translateY(-3px);box-shadow:var(--shadow);color:inherit;}
  .story__img{aspect-ratio:16/10;overflow:hidden;background:var(--cane-soft);}
  .story__img img{width:100%;height:100%;object-fit:cover;}
  .story__b{padding:20px 22px 24px;}
  .story .tag{display:inline-block;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:8px;}
  .story h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--cane-deep);font-weight:700;line-height:1.25;}
  .story h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:17px;color:var(--ink-soft);font-weight:500;margin-top:3px;}

  /* ===== Visit ===== */
  .visit{background:var(--cane-deep);color:#fff;}
  .visit-grid{display:grid;grid-template-columns:1fr;gap:40px;}
  @media(min-width:820px){.visit-grid{grid-template-columns:1fr 1fr;gap:50px;}}
  .visit h2{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:clamp(33px,5vw,50px);font-weight:700;line-height:1.15;}
  .visit h2 small{display:block;font-family:'PingFang TC',sans-serif;font-size:21px;color:rgba(255,255,255,.8);margin-top:8px;}
  .visit p{font-size:20px;color:rgba(255,255,255,.86);margin-top:18px;line-height:1.75;}
  .visit p.zh{font-family:'PingFang TC',sans-serif;font-size:19px;margin-top:12px;}
  .visit-cta{display:grid;grid-template-columns:1fr;gap:14px;margin-top:28px;max-width:440px;}
  .vbtn{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);color:#fff;padding:16px 20px;border-radius:14px;transition:transform .2s,background .2s,border-color .2s;}
  .vbtn:hover{background:var(--gold);border-color:var(--gold);color:#fff;transform:translateY(-3px);}
  .vbtn__ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
  .vbtn__tx{display:flex;flex-direction:column;line-height:1.3;}
  .vbtn__tx strong{font-size:19px;font-weight:700;}
  .vbtn__tx span{font-family:'PingFang TC',sans-serif;font-size:15.5px;color:rgba(255,255,255,.78);}
  .vbtn__ar{margin-left:auto;font-size:21px;color:rgba(255,255,255,.6);transition:transform .2s;}
  .vbtn:hover .vbtn__ar{color:#fff;transform:translateX(4px);}
  .contact{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:26px 28px;}
  .contact dt{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-top:14px;}
  .contact dt:first-child{margin-top:0;}
  .contact dd{font-size:20px;color:#fff;font-family:'PingFang TC',sans-serif;margin-top:3px;}
  .contact dd a{color:#fff;border-bottom:1px solid rgba(255,255,255,.4);}

  /* ===== Footer ===== */
  footer.site{background:#1a2418;color:rgba(255,255,255,.76);padding:38px 0 34px;font-size:18px;border-top:4px solid var(--gold);}
  footer.site .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;text-align:center;}
  footer.site a{color:var(--gold-soft);}
  /* reveal-fx */
  .rvl{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);}
  .rvl.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.rvl{opacity:1!important;transform:none!important;}}
</style>

  <main class="card" id="quiz-card">

      <div class="progress__no" id="qno">Question 1 / 12</div>
      <div class="progress__bar"><div class="progress__fill" id="bar"></div></div>

    <div class="question__zh" id="question-zh"></div>
    <div class="options" id="options"></div>

  </main>

  <main class="card result" id="result-card" style="display:none;">
    <div class="result__emoji" id="r-emoji">📖</div>
    <div class="result__title" id="r-title">Happy Book Day!</div>
    <div class="result__score">
      <span id="r-score">0</span> / <span id="r-total">12</span>
      <small id="r-pct">(0%)</small>
    </div>
    <p class="result__msg" id="r-msg-en">You did great!</p>
    <p class="result__zh" id="r-msg-zh">完成了！</p>
    <div class="result__actions">
      <button class="btn btn--primary" id="btn-restart">Try again · 再試一次</button>
      <a class="btn btn--ghost" href="../">← Back to handout · 回講義</a>

<script>
const QUIZ = [
  { q:'On what date is World Book Day celebrated each year?',
    zh:'世界閱讀日是每年的哪一天？',
    options:['March 23','April 23','May 23','June 23'], answer:1,
    explain:'4 月 23 日——莎士比亞與賽萬提斯同日逝世的紀念日。' },

  { q:'Which two famous writers both died on April 23, 1616?',
    zh:'哪兩位著名作家在 1616 年 4 月 23 日同日辭世？',
    options:['Hemingway and Tolstoy','Shakespeare and Cervantes','Dickens and Austen','Tagore and Lu Xun'], answer:1,
    explain:'Shakespeare (英) 與 Cervantes (西)——UNESCO 為紀念他們設立此節。' },

  { q:'Which word means "the person who wrote a book"?',
    zh:'哪一個單字代表「寫書的人」？',
    options:['Reader','Author','Librarian','Critic'], answer:1,
    explain:'"Author" 作者——my favorite author writes funny stories。' },

  { q:'Which word means "one part of a book, with its own title"?',
    zh:'哪一個單字代表「書中各自有標題的一部分」？',
    options:['Page','Chapter','Cover','Index'], answer:1,
    explain:'"Chapter" 章節——I finished chapter three。' },

  { q:'Which word means "a long story book, often made up by the author"?',
    zh:'哪一個單字代表「作者虛構的長篇故事書」？',
    options:['Dictionary','Magazine','Novel','Atlas'], answer:2,
    explain:'"Novel" 小說——通常較長、有完整情節。' },

  { q:'Which verb means "to take a book and return it later"?',
    zh:'哪一個動詞是「借書、之後再還」？',
    options:['Buy','Borrow','Hide','Wrap'], answer:1,
    explain:'"Borrow" 借——you can borrow up to five books from the library。' },

  { q:'Which verb means "to tell someone a book is worth trying"?',
    zh:'哪一個動詞是「告訴別人某本書值得讀」？',
    options:['Sell','Hide','Recommend','Race'], answer:2,
    explain:'"Recommend" 推薦——I recommend this novel。' },

  { q:'Which adjective means "loving to read and learn from books"?',
    zh:'哪一個形容詞代表「愛看書、愛從書中學習」？',
    options:['Bookish','Loud','Lazy','Sleepy'], answer:0,
    explain:'"Bookish" 愛看書的——my older sister is very bookish。' },

  { q:'Which adjective means "wanting to learn or know more"?',
    zh:'哪一個形容詞代表「好奇、想知道更多」？',
    options:['Tired','Curious','Bored','Hungry'], answer:1,
    explain:'"Curious" 好奇——a curious reader always asks "why?"' },

  { q:'In which Spanish region did the "rose and book" tradition begin?',
    zh:'「玫瑰與書」的傳統最早出自西班牙的哪一個地區？',
    options:['Andalusia','Catalonia','Madrid','Basque'], answer:1,
    explain:'Catalonia 加泰隆尼亞——情人節般的書與玫瑰互贈傳統。' },

  { q:'Ann: "Hey, I just finished a really ____ book. Want me to recommend it?"',
    zh:'Roleplay 1：「我剛讀完一本很 ____ 的書，要不要推薦給你？」',
    options:['boring','inspiring','heavy','loud'], answer:1,
    explain:'Scenario 1 用 inspiring——啟發人心的書才值得推薦。' },

  { q:'Librarian: "What are you ____ about?"',
    zh:'Roleplay 2 館員：「你對什麼很 ____ 呢？」',
    options:['hungry','curious','noisy','sleepy'], answer:1,
    explain:'Scenario 2 用 curious——好奇是選書的最佳起點。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Books open every door for you!'; msgZh='滿分！書本為你打開所有的門。'; }
  else if(pct >= 80)   { emoji='📖'; title='Excellent work!';  msgEn='Wonderful — a true reader at heart!'; msgZh='做得很好！真正的書蟲。'; }
  else if(pct >= 60)   { emoji='🌹'; title='Good effort!';     msgEn='Nice try — read the handout once more.'; msgZh='繼續加油！再回去看一次講義。'; }
  else                 { emoji='📚'; title='Keep practicing!'; msgEn="Don't give up — every reader starts somewhere!"; msgZh='不要放棄！每位讀者都是這樣開始的。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
