<style>
:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:#fffdf6;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:var(--g2);text-decoration:none;transition:color .2s;}
a:hover{color:var(--terra);}

/* Topbar */
.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:9px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1140px;margin:0 auto;padding:0 24px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.brand-name{font-family:'Cormorant Garamond','PingFang TC',serif;font-size:21px;font-weight:700;color:var(--g2);line-height:1.1;}
.brand-name small{display:block;font-family:'PingFang TC',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);margin-top:2px;letter-spacing:.04em;}
.topbar-nav{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
.topbar-nav a{color:var(--ink);font-size:18.5px;font-weight:500;letter-spacing:.02em;padding:9px 14px;border-radius:9px;line-height:1.2;transition:background .15s,color .15s;}
.topbar-nav a:hover{color:var(--g2);background:var(--g-soft);}
.topbar-nav a.is-active{color:var(--g2);font-weight:700;background:var(--g-soft);}
@media(max-width:820px){.topbar-inner{flex-direction:column;align-items:stretch;gap:6px;}.topbar-nav{gap:4px;justify-content:flex-start;width:100%;}.topbar-nav a{padding:10px 13px;font-size:17px;}.brand img{width:40px;height:40px;}}

/* Banner */
.pbanner{background:linear-gradient(135deg,#5b9c3f 0%,#316821 50%,#1a4a0e 100%);padding:48px 24px 40px;text-align:center;position:relative;overflow:hidden;}
.pbanner::before{content:'🌟';position:absolute;font-size:120px;opacity:.06;top:-20px;left:-20px;}
.pbanner::after{content:'🎉';position:absolute;font-size:120px;opacity:.06;bottom:-20px;right:-20px;}
.pbanner .inner{position:relative;z-index:1;}
.pbanner .eyebrow{display:inline-block;background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);font-size:14px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;padding:6px 16px;border-radius:20px;margin-bottom:14px;}
.pbanner h1{font-family:'Nunito','PingFang TC',sans-serif;font-size:clamp(34px,6vw,60px);font-weight:900;color:#fff;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.3);}
.pbanner h1 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:clamp(18px,2.5vw,26px);color:rgba(255,255,255,.9);font-weight:600;margin-top:10px;letter-spacing:.06em;}
.pbanner .subtitle{margin-top:14px;color:rgba(255,255,255,.8);font-family:'PingFang TC',sans-serif;font-size:18px;}
.stars{display:flex;justify-content:center;gap:6px;margin-top:16px;font-size:22px;}

/* Main app */
.app{max-width:1100px;margin:0 auto;padding:32px 20px 120px;}

/* Progress bar */
.progress-wrap{margin-bottom:28px;}
.progress-bar{height:8px;background:#e0ddd4;border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#5b9c3f,#c89a3a);border-radius:6px;transition:width .4s cubic-bezier(.2,.7,.2,1);}
.progress-label{font-family:'PingFang TC',sans-serif;font-size:15px;color:var(--ink-soft);margin-bottom:8px;text-align:center;}

/* Page header */
.page-header{text-align:center;margin-bottom:24px;}
.page-num{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:50px;padding:10px 22px;box-shadow:var(--shadow-sm);}
.page-num .pg{font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;color:var(--g2);}
.page-num .sep{color:#ccc;font-size:20px;}
.page-num .total{font-family:'PingFang TC',sans-serif;font-size:16px;color:var(--ink-soft);}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:680px){.cards{grid-template-columns:repeat(2,1fr);gap:10px;}}
@media(max-width:380px){.cards{grid-template-columns:1fr;}}

/* Single card */
.card{background:#fff;border-radius:20px;border:2px solid transparent;box-shadow:0 4px 14px -4px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px -8px rgba(0,0,0,.18);}
.card-top{height:8px;flex-shrink:0;}
.card-body{padding:18px 16px 14px;flex:1;display:flex;flex-direction:column;gap:8px;}
.card-num{font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:#bbb;letter-spacing:.1em;}
.card-en{font-family:'Nunito',sans-serif;font-size:clamp(22px,3.5vw,32px);font-weight:900;color:var(--ink);line-height:1.15;word-break:break-word;}
.card-zh{font-family:'PingFang TC',sans-serif;font-size:clamp(16px,2.5vw,20px);font-weight:600;color:#444;line-height:1.4;}
.card-pos{display:inline-block;font-family:'PingFang TC',sans-serif;font-size:12px;color:#888;background:#f4f2ed;border-radius:10px;padding:2px 10px;margin-top:2px;align-self:flex-start;}
.card-footer{padding:10px 16px 14px;display:flex;justify-content:flex-end;}
.speak-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .18s,opacity .18s;background:#f0ede4;}
.speak-btn:hover{transform:scale(1.15);opacity:.85;}
.speak-btn:active{transform:scale(.95);}

/* Card accent colors — cycle by position */
.card:nth-child(9n+1) .card-top{background:var(--c0);}
.card:nth-child(9n+2) .card-top{background:var(--c1);}
.card:nth-child(9n+3) .card-top{background:var(--c2);}
.card:nth-child(9n+4) .card-top{background:var(--c3);}
.card:nth-child(9n+5) .card-top{background:var(--c4);}
.card:nth-child(9n+6) .card-top{background:var(--c5);}
.card:nth-child(9n+7) .card-top{background:var(--c6);}
.card:nth-child(9n+8) .card-top{background:var(--c7);}
.card:nth-child(9n+0) .card-top{background:var(--c8);}

.card:nth-child(9n+1) .speak-btn{background:#ffe8f2;}
.card:nth-child(9n+2) .speak-btn{background:#e0faf8;}
.card:nth-child(9n+3) .speak-btn{background:#fff3e0;}
.card:nth-child(9n+4) .speak-btn{background:#e0f4ff;}
.card:nth-child(9n+5) .speak-btn{background:#f0e8ff;}
.card:nth-child(9n+6) .speak-btn{background:#fff0f6;}
.card:nth-child(9n+7) .speak-btn{background:#fffff0;}
.card:nth-child(9n+8) .speak-btn{background:#e8f8f0;}
.card:nth-child(9n+0) .speak-btn{background:#ffe8ea;}

.nav-btn:hover:not(:disabled){background:var(--g2);color:#fff;}
.nav-btn:disabled{opacity:.35;cursor:default;border-color:#ccc;color:#ccc;}
.nav-btn .arrow{font-size:20px;}
.page-select-wrap{display:flex;align-items:center;gap:8px;}
.page-select-wrap label{font-family:'PingFang TC',sans-serif;font-size:14px;color:var(--ink-soft);}
.page-select{font-family:'Nunito','PingFang TC',sans-serif;font-size:16px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);cursor:pointer;max-width:100px;}

@keyframes pulse-ring{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(255,107,157,.6);}70%{transform:scale(1);box-shadow:0 0 0 10px rgba(255,107,157,0);}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(255,107,157,0);}}
.speak-btn.speaking{animation:pulse-ring 1s ease-out infinite;}

footer.site{background:#1a2418;color:rgba(255,255,255,.76);padding:38px 0 34px;font-size:17px;border-top:4px solid var(--gold);text-align:center;}
footer.site a{color:var(--gold-soft);}

let cur=1;
const TOTAL=PAGES.length;

function speak(word,btn){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=0.85;u.pitch=1.1;
  if(btn){
    btn.classList.add('speaking');
    u.onend=()=>btn.classList.remove('speaking');
    u.onerror=()=>btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(u);
}

function render(p){
  const page=PAGES[p-1];
  const container=document.getElementById('cards');
  let globalIdx=(p-1)*9;
  container.innerHTML=page.map(([en,zh,pos],i)=>{
    globalIdx++;
    return`<div class="card">
  <div class="card-top"></div>
  <div class="card-body">
    <div class="card-num">#${globalIdx}</div>
    <div class="card-en">${en}</div>
    <div class="card-zh">${zh}</div>
    <span class="card-pos">${pos}</span>
  </div>
  <div class="card-footer">
    <button class="speak-btn" onclick="speak('${en.replace(/'/g,"\\'")}',this)" title="聽發音" aria-label="播放 ${en} 的發音">🔊</button>
  </div>
</div>`;
  }).join('');

  document.getElementById('cur-page').textContent=p;
  document.getElementById('progress-label').textContent=`第 ${p} 頁，共 ${TOTAL} 頁`;
  document.getElementById('progress-fill').style.width=((p/TOTAL)*100)+'%';
  document.getElementById('btn-prev').disabled=(p===1);
  document.getElementById('btn-next').disabled=(p===TOTAL);
  document.getElementById('page-sel').value=p;
  window.scrollTo({top:0,behavior:'smooth'});
}

function goPage(p){
  if(p<1||p>TOTAL)return;
  cur=p;render(p);
}

// Build page selector
(function(){
  const sel=document.getElementById('page-sel');
  for(let i=1;i<=TOTAL;i++){
    const o=document.createElement('option');
    o.value=i;o.textContent='第 '+i+' 頁';
    sel.appendChild(o);
  }
})();

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')goPage(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')goPage(cur-1);
});

render(1);
</script>
