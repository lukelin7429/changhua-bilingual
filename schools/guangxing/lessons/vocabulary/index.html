let cur=1;
const TOTAL=PAGES.length;

function speak(word,btn){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=0.85;u.pitch=1.1;
  if(btn){
    btn.classList.add('speaking');
    u.onend=()=>btn.classList.remove('speaking');
    u.onerror=()=>btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(u);
}

function esc(s){return s.replace(/'/g,"\\'");}

function render(p){
  const page=PAGES[p-1];
  let base=(p-1)*9;
  document.getElementById('cards').innerHTML=page.map(([en,zh,pos,ex],i)=>`
<div class="card">
  <div class="card-top"></div>
  <div class="card-body">
    <div class="card-num">#${base+i+1}</div>
    <div class="card-en">${en}</div>
    <div class="card-zh">${zh}</div>
    <span class="card-pos">${pos}</span>
    <div class="card-ex">${ex}<button class="speak-ex-btn" onclick="speak('${esc(ex)}',this)" title="聽例句">🔊</button></div>
  </div>
  <div class="card-footer">
    <button class="speak-btn" onclick="speak('${esc(en)}',this)" title="聽單字發音" aria-label="播放 ${en} 的發音">🔊</button>
  </div>
</div>`).join('');
  document.getElementById('cur-page').textContent=p;
  document.getElementById('progress-label').textContent=`第 ${p} 頁，共 ${TOTAL} 頁`;
  document.getElementById('progress-fill').style.width=((p/TOTAL)*100)+'%';
  document.getElementById('btn-prev').disabled=(p===1);
  document.getElementById('btn-next').disabled=(p===TOTAL);
  document.getElementById('page-sel').value=p;
  window.scrollTo({top:0,behavior:'smooth'});
}

function goPage(p){if(p<1||p>TOTAL)return;cur=p;render(p);}

(function(){
  const sel=document.getElementById('page-sel');
  for(let i=1;i<=TOTAL;i++){
    const o=document.createElement('option');
    o.value=i;o.textContent='第 '+i+' 頁';
    sel.appendChild(o);
  }
})();

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')goPage(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')goPage(cur-1);
});

render(1);
</script>
