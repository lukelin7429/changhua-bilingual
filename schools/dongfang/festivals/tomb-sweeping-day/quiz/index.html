<html lang="zh-Hant">
<head>

<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --grass:#2f9e44;--grass-deep:#1c6b34;--grass-soft:#e7f4ea;
    --sun:#e8980c;--sun-deep:#a86a00;--sun-soft:#fdf1d4;
    --flame:#e8472b;--flame-deep:#b62f1a;--flame-soft:#fde3dd;
    --sky:#2f7fc4;--sky-deep:#1f5a91;--sky-soft:#e2eef8;
    --ink:#1f2a26;--ink-soft:#566b62;--line:#e2e8e2;--bg-soft:#f4f8f4;
    --shadow:0 14px 38px -16px rgba(28,77,40,.30);--shadow-sm:0 6px 16px -6px rgba(28,77,40,.18);
    --max:1140px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:21px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  @media(min-width:720px){body{font-size:23px;}}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}
  img{max-width:100%;display:block;}
  a{color:var(--grass-deep);text-decoration:none;transition:color .2s;}
  a:hover{color:var(--sun-deep);}
  .serif{font-family:'Fraunces','PingFang TC',serif;}

  /* topbar */
  .topbar{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:8px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;border:1px solid var(--line);box-shadow:var(--shadow-sm);flex-shrink:0;}
  .brand-name{font-family:'Fraunces','PingFang TC',serif;font-size:21px;font-weight:600;color:var(--grass-deep);line-height:1.1;}
  .brand-name small{display:block;font-family:'PingFang TC',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);margin-top:2px;letter-spacing:.03em;}
  .topbar-nav{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .topbar-nav a{color:var(--ink);font-size:18.5px;font-weight:500;letter-spacing:.02em;padding:9px 13px;border-radius:9px;line-height:1.2;transition:background .15s,color .15s;}
  .topbar-nav a:hover{color:var(--grass-deep);background:var(--grass-soft);}
  .topbar-nav a.is-active{color:var(--grass-deep);font-weight:700;background:var(--grass-soft);}
  @media(max-width:820px){.topbar-inner{flex-direction:column;align-items:stretch;gap:6px;}.topbar-nav{gap:4px;justify-content:flex-start;width:100%;}.topbar-nav a{padding:10px 12px;font-size:18px;}.brand img{width:40px;height:40px;}}

  /* photo banner */
  .pbanner{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(320px,46vh,500px);text-align:center;color:#fff;border-bottom:5px solid var(--sun);padding:64px 24px 44px;background-size:cover;background-position:center 46%;}
  @media(min-width:720px){.pbanner{min-height:clamp(380px,52vh,540px);padding:84px 24px 54px;}}
  .pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,40,24,.06) 0%,rgba(20,40,24,0) 40%,rgba(20,40,24,.5) 74%,rgba(16,36,20,.9) 100%);}
  .pbanner>.bn{position:relative;z-index:1;}
  .pbanner .eyebrow{display:inline-block;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--sun-soft);font-weight:700;margin-bottom:12px;text-shadow:0 1px 8px rgba(0,0,0,.6);}
  .pbanner h1{font-family:'Fraunces','PingFang TC',serif;font-size:clamp(40px,7vw,68px);font-weight:600;line-height:1.06;text-shadow:0 2px 18px rgba(0,0,0,.6);}
  .pbanner h1 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:clamp(18px,2.4vw,25px);color:rgba(255,255,255,.95);font-weight:500;margin-top:10px;letter-spacing:.06em;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  .pbanner .bdiv{width:60px;height:2px;background:var(--sun);border:0;margin:20px auto 16px;}
  .pbanner .lede{max-width:660px;margin:0 auto;font-family:'Fraunces',serif;font-style:italic;font-size:clamp(18px,2.2vw,22px);color:rgba(255,255,255,.97);line-height:1.5;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  .pbanner .lede .zh{display:block;font-style:normal;font-family:'PingFang TC',sans-serif;font-size:18px;margin-top:8px;color:rgba(255,255,255,.88);}
  .factstrip{display:flex;flex-wrap:wrap;justify-content:center;gap:0;max-width:820px;margin:26px auto 0;position:relative;z-index:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;backdrop-filter:blur(6px);overflow:hidden;}
  .fact{flex:1 1 170px;padding:15px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.16);}
  .fact:last-child{border-right:0;}
  .fact .fe{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);}
  .fact .fz{font-size:15px;margin-top:5px;color:var(--sun-soft);font-family:'PingFang TC',sans-serif;}
  @media(max-width:640px){.fact{flex:1 1 45%;border-bottom:1px solid rgba(255,255,255,.14);}.fact:nth-child(2n){border-right:0;}}

  section{padding:64px 0;}
  @media(min-width:720px){section{padding:76px 0;}}
  .sec-head{text-align:center;margin-bottom:46px;}
  .sec-head .eyebrow{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;color:var(--grass);}
  .sec-head h2{font-family:'Fraunces','PingFang TC',serif;font-size:clamp(33px,5vw,50px);font-weight:600;color:var(--grass-deep);line-height:1.18;}
  .sec-head h2 .zh{font-family:'PingFang TC',sans-serif;font-size:20px;color:var(--ink-soft);font-weight:500;display:block;margin-top:6px;letter-spacing:.04em;}
  .sec-head .lede{color:var(--ink-soft);font-size:20px;max-width:680px;margin:16px auto 0;line-height:1.7;}

  footer.site{background:var(--grass-deep);color:#fff;padding:46px 0 30px;text-align:center;}
  footer.site .wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
  footer.site img{width:54px;height:54px;border-radius:50%;background:#fff;padding:4px;margin-bottom:6px;}
  footer.site .fn{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  footer.site .fz{font-size:15px;color:rgba(255,255,255,.8);}
  footer.site .fmeta{font-size:14px;color:rgba(255,255,255,.7);margin-top:10px;line-height:1.7;}
  footer.site a{color:var(--sun-soft);border-bottom:1px dashed rgba(232,152,12,.6);}

  .rvl{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);}
  .rvl.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.rvl{opacity:1!important;transform:none!important;}}

  .about{display:grid;grid-template-columns:1fr;gap:40px;align-items:start;}
  @media(min-width:900px){.about{grid-template-columns:1.05fr .95fr;gap:52px;}}
  .about h3{font-family:'Fraunces','PingFang TC',serif;font-size:clamp(27px,4vw,36px);color:var(--grass-deep);line-height:1.25;margin-bottom:16px;font-weight:600;}
  .about p{font-size:20px;color:var(--ink);margin-bottom:14px;line-height:1.75;}
  .about p.zh{font-family:'PingFang TC',sans-serif;font-size:19px;color:var(--ink-soft);line-height:1.85;}
  .about strong{color:var(--grass-deep);}
  .about-photo{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;}
  .about-photo img{width:100%;height:100%;object-fit:cover;}
  .about-photo .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(16,36,20,.82),transparent);color:#fff;padding:20px 18px 14px;font-family:'PingFang TC',sans-serif;font-size:17px;}
  .about-photo .cap .en{display:block;font-family:'Fraunces',serif;font-style:italic;font-size:20px;margin-bottom:2px;}

  /* FET feature */
  .feat{position:relative;display:grid;grid-template-columns:1fr;gap:30px;align-items:center;background:linear-gradient(135deg,var(--grass-soft) 0%,var(--sun-soft) 100%);border:1px solid var(--line);border-radius:26px;padding:32px 28px;box-shadow:var(--shadow);overflow:hidden;}
  @media(min-width:860px){.feat{grid-template-columns:.82fr 1.18fr;gap:44px;padding:44px 48px;}}
  .feat__photo{width:100%;max-width:300px;margin:0 auto;aspect-ratio:3/4;object-fit:cover;border-radius:18px;box-shadow:var(--shadow);border:4px solid #fff;}
  .feat__role{color:var(--flame-deep);font-size:16px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
  .feat h3{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,40px);color:var(--grass-deep);line-height:1.15;margin-top:6px;font-weight:600;}
  .feat h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:20px;color:var(--ink-soft);font-weight:500;margin-top:5px;}
  .feat p{font-size:19px;color:var(--ink);margin-top:16px;line-height:1.7;}
  .feat p.zh{font-family:'PingFang TC',sans-serif;font-size:18px;color:var(--ink-soft);}
  .feat__pts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;}
  .feat__pt{font-size:16px;font-weight:600;padding:8px 15px;border-radius:22px;background:#fff;color:var(--grass-deep);border:1px solid var(--line);}
  .feat__cta{display:inline-flex;align-items:center;gap:9px;margin-top:22px;background:var(--grass-deep);color:#fff;padding:14px 28px;border-radius:13px;font-weight:700;font-size:19px;font-family:'Fraunces',serif;transition:background .2s,transform .2s;}
  .feat__cta:hover{background:var(--sun-deep);color:#fff;transform:translateY(-2px);}

  .pillars{display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:760px){.pillars{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1040px){.pillars{grid-template-columns:repeat(4,1fr);}}
  .pillar{background:#fff;border-radius:18px;padding:30px 26px;border:1px solid var(--line);box-shadow:var(--shadow-sm);border-top:7px solid var(--grass);transition:transform .25s,box-shadow .25s;}
  .pillar:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
  .pillar:nth-child(2){border-top-color:var(--sun);}
  .pillar:nth-child(3){border-top-color:var(--sky);}
  .pillar:nth-child(4){border-top-color:var(--flame);}
  .pillar .ic{font-size:46px;line-height:1;margin-bottom:14px;}
  .pillar h3{font-family:'Fraunces','PingFang TC',serif;font-size:25px;color:var(--grass-deep);font-weight:600;line-height:1.2;}
  .pillar h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:18px;color:var(--ink-soft);font-weight:500;margin-top:4px;}
  .pillar p{font-size:18px;color:var(--ink-soft);margin-top:12px;line-height:1.65;}

  /* soccer spotlight */
  .spotlight{position:relative;display:grid;grid-template-columns:1fr;gap:0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);}
  @media(min-width:880px){.spotlight{grid-template-columns:1.1fr .9fr;}}
  .spotlight__img{position:relative;min-height:280px;background-size:cover;background-position:center;}
  .spotlight__body{background:linear-gradient(135deg,var(--grass-deep) 0%,#155028 100%);color:#fff;padding:38px 32px;}
  @media(min-width:720px){.spotlight__body{padding:52px 48px;}}
  .spotlight__badge{display:inline-block;background:var(--sun);color:#3a2700;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;border-radius:99px;}
  .spotlight h3{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,42px);font-weight:600;line-height:1.12;margin-top:16px;}
  .spotlight h3 small{display:block;font-family:'PingFang TC',sans-serif;font-size:20px;color:rgba(255,255,255,.82);font-weight:500;margin-top:6px;}
  .spotlight p{font-size:19px;color:rgba(255,255,255,.92);margin-top:16px;line-height:1.7;}
  .spotlight p.zh{font-family:'PingFang TC',sans-serif;font-size:18px;color:rgba(255,255,255,.78);}
  .spotlight__stats{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;}
  .spotlight__stat .n{font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:var(--sun-soft);line-height:1;}
  .spotlight__stat .l{font-size:15px;color:rgba(255,255,255,.8);margin-top:4px;}

  /* lessons teaser */
  .teaser{background:linear-gradient(135deg,var(--sky-soft) 0%,var(--grass-soft) 100%);border:1px solid var(--line);border-radius:24px;padding:40px 32px;text-align:center;box-shadow:var(--shadow-sm);}

<script>
const QUIZ = [
  { q:'Which word means "a family member who lived a long time ago"?',
    zh:'哪一個單字代表「很久以前的家族成員」？',
    options:['Picnic','Ancestor','Kite','Tomb'], answer:1,
    explain:'"Ancestor" 祖先——my great-grandfather is one of our ancestors。' },

  { q:'"Three sticks of ____ are held gently to honor the ancestors."',
    zh:'「我們手持三炷 ____，敬拜祖先。」',
    options:['kites','tea','incense','flowers'], answer:2,
    explain:'"Incense" 線香——三炷香是清明祭祖最常見的動作。' },

  { q:'Which adjective means "feeling thanks for what someone has done"?',
    zh:'哪一個形容詞是「感恩的」？',
    options:['Peaceful','Grateful','Solemn','Quiet'], answer:1,
    explain:'"Grateful" 感恩——對祖先給予的一切心懷感激。' },

  { q:'Which verb means "to show deep respect for someone"?',
    zh:'哪一個動詞代表「對某人致以最高敬意」？',
    options:['Sweep','Honor','Hide','Race'], answer:1,
    explain:'"Honor" 敬重——we honor our ancestors today。' },

  { q:'Where did Jie Zitui go to live with his old mother?',
    zh:'介子推帶著母親去哪裡隱居？',
    options:['Beside a river','In a busy market','In the mountains','Under the sea'], answer:2,
    explain:'介子推帶母親隱居山中，後來文公放火燒山。' },

  { q:'Why did the king order people to eat only cold food on that day?',
    zh:'晉文公為什麼下令這一天只能吃冷食？',
    options:['Because firewood was expensive','To remember Jie Zitui and his mother','Because cold food is healthier','To save time'], answer:1,
    explain:'紀念介子推母子——文公燒山逼他出來不成，悲痛之餘下令禁火。' },

  { q:'What do families usually leave on the family tomb?',
    zh:'家人通常會在墓上擺什麼？',
    options:['Phones and keys','Fruit, sweet cakes, and tea','Books','Toys'], answer:1,
    explain:'供品：新鮮水果、甜糕點、一杯熱茶——簡單而誠心。' },

  { q:'Why do families fly kites in the afternoon of this festival?',
    zh:'清明下午為什麼放風箏？',
    options:['Because the wind is strongest','To enjoy the spring and let go of bad luck','To compete with neighbors','Because school says so'], answer:1,
    explain:'踏青放風箏——一邊享受春天，一邊象徵讓壞運氣飛走。' },

  { q:'The day before Tomb-Sweeping Day is called ____ Day.',
    zh:'清明節的前一天叫 ____ 日。',
    options:['Hot Food','Cold Food','New Food','Fast Food'], answer:1,
    explain:'寒食日 Cold Food Day——延續介子推故事的禁火傳統。' },

  { q:'Grandma: "Then we ____ three times and say a quiet hello."',
    zh:'Roleplay 1：「然後我們 ____ 三次，向爺爺輕聲問安。」',
    options:['jump','bow','run','sing'], answer:1,
    explain:'Scenario 1 用 bow——鞠躬三次是傳統的致敬方式。' },

  { q:'Child: "I want to ____ her every Tomb-Sweeping Day."',
    zh:'Roleplay 2：「每年清明節，我都想 ____ 她。」',
    options:['forget','remember','sell','copy'], answer:1,
    explain:'Scenario 2 用 remember——紀念是清明節最重要的精神。' },

  { q:'Dad: "In the old days, people believed kites carried away ____."',
    zh:'Roleplay 3：「從前的人相信風箏會帶走 ____。」',
    options:['homework','bad luck','rain','sunshine'], answer:1,
    explain:'Scenario 3 用 bad luck——放風箏的傳統意義是把壞運氣放走。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Your ancestors would be proud of you.'; msgZh='滿分！祖先一定也以你為榮。'; }
  else if(pct >= 80)   { emoji='🌿'; title='Excellent work!';  msgEn='Wonderful — a thoughtful student remembers well.'; msgZh='做得很好！有心的學生最會紀念。'; }
  else if(pct >= 60)   { emoji='🕯️'; title='Good effort!';    msgEn='Nice try — review the story of Jie Zitui once more.'; msgZh='繼續加油！再讀一次介子推的故事。'; }
  else                 { emoji='🪁'; title='Keep practicing!'; msgEn="Don't give up — go back to the handout and try again!"; msgZh='不要放棄！回去再讀一次講義就會了。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
