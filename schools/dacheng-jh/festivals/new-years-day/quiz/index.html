<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival 16 Quiz · New Year's Day · Festival English Series</title>
<meta name="description" content="Festival 16 Quiz — New Year's Day. 12 questions on the Gregorian calendar, vocabulary, traditions, and roleplay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0a2a5e;
    --blue:#16447f;
    --blue-light:#4a6aa5;
    --blue-soft:#d6e0ef;
    --teal:#1f7a8c;
    --teal-soft:#cfe5e9;
    --teal-deep:#0c4754;
    --olive:#c9c920;
    --olive-soft:#f0f1c3;
    --olive-deep:#8c8e0a;
    --red:#e63d2e;
    --red-soft:#fde2dd;
    --sun:#f0a722;
    --sun-soft:#feeed0;
    --sun-deep:#a06c10;
    --sand:#f6efde;
    --ink:#1f2530;
    --ink-soft:#5a606e;
    --line:#e1e2d0;
    --shadow:0 14px 38px -16px rgba(10,42,94,.30);
    --shadow-sm:0 6px 16px -6px rgba(10,42,94,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:#fff;
    color:var(--ink);
    font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
    font-size:20px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (min-width:720px){ body{ font-size:23px; } }

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .serif{font-family:'Playfair Display','PingFang TC',serif;}

  section{padding:56px 0;border-bottom:1px solid var(--line);}
  @media (min-width:720px){ section{ padding:80px 0; } }
  section:last-of-type{border-bottom:none;}

  .sec__no{
    font-family:'Playfair Display',serif;
    color:var(--red);font-size:22px;font-weight:700;letter-spacing:5px;
  }
  @media (min-width:720px){ .sec__no{ font-size:25px; } }
  .sec__title{
    font-family:'Playfair Display',serif;
    font-size:42px;font-weight:700;color:var(--blue-deep);
    line-height:1.15;margin-top:6px;letter-spacing:.5px;
  }
  @media (min-width:720px){ .sec__title{ font-size:60px; } }
  .sec__title-zh{
    font-size:20px;color:var(--ink-soft);font-weight:500;
    margin-top:10px;letter-spacing:1px;
  }
  @media (min-width:720px){ .sec__title-zh{ font-size:24px; } }
  .sec__rule{
    width:96px;height:6px;background:var(--teal);
    border-radius:3px;margin:22px 0 36px;
  }

  .about__lead{
    font-family:'Playfair Display',serif;
    font-size:30px;font-weight:700;color:var(--blue-deep);line-height:1.35;letter-spacing:.3px;
  }
  @media (min-width:720px){ .about__lead{ font-size:38px; } }
  .about__lead-zh{
    font-size:21px;color:var(--ink-soft);font-weight:500;margin-top:14px;line-height:1.55;
  }
  @media (min-width:720px){ .about__lead-zh{ font-size:25px; } }
  .about__body{margin-top:24px;font-size:20px;color:var(--ink);line-height:1.75;}
  @media (min-width:720px){ .about__body{ font-size:22px; } }
  .about__body p{margin-top:16px;}
  .about__body p:first-child{margin-top:0;}
  .about__body .zh{color:var(--ink-soft);font-size:18px;margin-top:8px;line-height:1.65;}
  @media (min-width:720px){ .about__body .zh{ font-size:20px; } }
  .about__body strong{color:var(--blue-deep);font-weight:700;}

  .quote{
    margin-top:36px;background:var(--teal-soft);border-left:6px solid var(--teal);
    padding:24px 28px;border-radius:0 12px 12px 0;
  }
  .quote__text{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;color:var(--teal-deep);
    line-height:1.4;font-style:italic;
  }
  @media (min-width:720px){ .quote__text{ font-size:32px; } }
  .quote__zh{font-size:17px;color:var(--ink-soft);margin-top:8px;line-height:1.55;}
  @media (min-width:720px){ .quote__zh{ font-size:20px; } }
  .quote--principal{background:var(--sun-soft);border-left-color:var(--sun);}
  .quote--principal .quote__text{color:var(--sun-deep);}

  /* Three anchors */
  .anchors{display:grid;grid-template-columns:1fr;gap:22px;}
  @media (min-width:720px){ .anchors{ grid-template-columns:repeat(3,1fr);gap:24px; } }
  .anchor{
    background:#fff;border-radius:20px;border:1px solid var(--line);
    padding:32px 28px;box-shadow:var(--shadow-sm);
    border-top:8px solid var(--teal);
    transition:transform .2s, box-shadow .2s;
  }
  @media (min-width:720px){ .anchor{ padding:36px 32px; } }
  .anchor:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .anchor:nth-child(2){border-top-color:var(--olive);}
  .anchor:nth-child(3){border-top-color:var(--sun);}
  .anchor__no{
    font-family:'Playfair Display',serif;
    color:var(--red);font-size:18px;font-weight:700;letter-spacing:3px;
  }
  @media (min-width:720px){ .anchor__no{ font-size:21px; } }
  .anchor__icon{font-size:52px;line-height:1;margin:6px 0 12px;}
  @media (min-width:720px){ .anchor__icon{ font-size:60px; } }
  .anchor__title{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;color:var(--blue-deep);line-height:1.2;
    border-bottom:3px solid var(--teal);padding-bottom:6px;display:inline-block;
  }
  @media (min-width:720px){ .anchor__title{ font-size:30px; } }
  .anchor:nth-child(2) .anchor__title{border-bottom-color:var(--olive);}
  .anchor:nth-child(3) .anchor__title{border-bottom-color:var(--sun);}
  .anchor__title-zh{
    font-size:19px;color:var(--ink);font-weight:600;margin-top:10px;letter-spacing:1px;
  }
  @media (min-width:720px){ .anchor__title-zh{ font-size:22px; } }
  .anchor__body{font-size:17px;color:var(--ink-soft);margin-top:14px;line-height:1.65;}
  @media (min-width:720px){ .anchor__body{ font-size:19px; } }

  /* Vocational spotlight */
  .voc-spot{
    background:linear-gradient(135deg, var(--sun-soft) 0%, var(--teal-soft) 100%);
    border-radius:24px;padding:40px 30px;border:2px solid var(--sun);
    box-shadow:var(--shadow);
  }
  @media (min-width:720px){ .voc-spot{ padding:56px 48px; } }
  .voc-spot__badge{
    display:inline-block;background:var(--red);color:#fff;
    font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    padding:6px 14px;border-radius:99px;
  }
  @media (min-width:720px){ .voc-spot__badge{ font-size:14px; } }
  .voc-spot__title{
    font-family:'Playfair Display',serif;
    font-size:32px;font-weight:700;color:var(--blue-deep);
    line-height:1.2;margin-top:18px;
  }
  @media (min-width:720px){ .voc-spot__title{ font-size:46px; } }
  .voc-spot__zh{
    font-size:19px;color:var(--ink);font-weight:600;margin-top:8px;
  }
  @media (min-width:720px){ .voc-spot__zh{ font-size:23px; } }
  .voc-spot__body{
    font-size:18px;color:var(--ink);margin-top:18px;line-height:1.7;max-width:780px;
  }
  @media (min-width:720px){ .voc-spot__body{ font-size:21px; } }
  .voc-spot__body .zh{display:block;color:var(--ink-soft);font-size:16px;margin-top:8px;line-height:1.65;}
  @media (min-width:720px){ .voc-spot__body .zh{ font-size:19px; } }
  .voc-spot__wins{
    margin-top:24px;display:grid;grid-template-columns:1fr;gap:12px;
  }
  @media (min-width:720px){ .voc-spot__wins{ grid-template-columns:1fr 1fr 1fr;gap:14px; } }
  .voc-spot__win{
    background:#fff;border-radius:12px;padding:18px 20px;
    border-left:5px solid var(--red);box-shadow:var(--shadow-sm);
  }
  .voc-spot__win-label{
    font-size:12px;font-weight:700;letter-spacing:2px;color:var(--red);
    text-transform:uppercase;
  }
  @media (min-width:720px){ .voc-spot__win-label{ font-size:13px; } }
  .voc-spot__win-text{
    font-size:16px;color:var(--blue-deep);font-weight:600;margin-top:4px;line-height:1.4;
  }
  @media (min-width:720px){ .voc-spot__win-text{ font-size:18px; } }
  .voc-spot__win-zh{
    font-size:14px;color:var(--ink-soft);margin-top:4px;line-height:1.5;
  }
  @media (min-width:720px){ .voc-spot__win-zh{ font-size:15px; } }

  /* Programs */
  .programs{display:flex;flex-direction:column;gap:24px;}
  .program{
    background:#fff;border-radius:18px;border:1px solid var(--line);
    padding:30px 28px;box-shadow:var(--shadow-sm);
    display:grid;grid-template-columns:80px 1fr;gap:24px;align-items:start;
  }
  @media (min-width:720px){ .program{grid-template-columns:120px 1fr;gap:36px;padding:38px 36px;} }
  .program__icon{
    font-size:52px;line-height:1;text-align:center;
    background:var(--teal-soft);border-radius:14px;padding:14px 0;color:var(--teal-deep);
  }
  @media (min-width:720px){ .program__icon{ font-size:74px;padding:20px 0; } }
  .program__title{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;color:var(--blue-deep);line-height:1.2;
  }
  @media (min-width:720px){ .program__title{ font-size:34px; } }
  .program__title-zh{
    font-size:19px;color:var(--ink);font-weight:600;margin-top:6px;
  }
  @media (min-width:720px){ .program__title-zh{ font-size:23px; } }
  .program__body{font-size:18px;color:var(--ink);margin-top:14px;line-height:1.65;}
  @media (min-width:720px){ .program__body{ font-size:21px; } }
  .program__zh{font-size:16px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}
  @media (min-width:720px){ .program__zh{ font-size:19px; } }
  .program__honor{
    margin-top:12px;display:inline-block;background:var(--red-soft);color:var(--red);
    font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;letter-spacing:.5px;
  }
  @media (min-width:720px){ .program__honor{ font-size:15px; } }

  /* Timeline */
  .timeline{position:relative;padding-left:42px;}
  .timeline::before{
    content:'';position:absolute;left:14px;top:8px;bottom:8px;width:4px;
    background:linear-gradient(180deg, var(--teal) 0%, var(--blue) 100%);
    border-radius:2px;
  }
  .tl-item{position:relative;padding-bottom:28px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:'';position:absolute;left:-34px;top:8px;
    width:18px;height:18px;border-radius:50%;
    background:#fff;border:4px solid var(--teal);
    box-shadow:0 0 0 4px var(--sand);
  }
  .tl-item.is-milestone::before{border-color:var(--red);}
  .tl-year{
    font-family:'Playfair Display',serif;
    font-size:30px;font-weight:800;color:var(--teal-deep);line-height:1;letter-spacing:.5px;
  }
  @media (min-width:720px){ .tl-year{ font-size:38px; } }
  .tl-item.is-milestone .tl-year{color:var(--red);}
  .tl-event{
    font-size:20px;color:var(--ink);font-weight:600;margin-top:6px;line-height:1.45;
  }
  @media (min-width:720px){ .tl-event{ font-size:23px; } }
  .tl-detail{font-size:17px;color:var(--ink-soft);margin-top:4px;line-height:1.55;}
  @media (min-width:720px){ .tl-detail{ font-size:19px; } }

  /* Contact */
  .contact{
    background:linear-gradient(135deg, var(--blue-deep) 0%, var(--teal-deep) 100%);
    color:#fff;border-radius:24px;padding:48px 36px;box-shadow:var(--shadow);
  }
  @media (min-width:720px){ .contact{ padding:64px 56px; } }
  .contact__title{
    font-family:'Playfair Display',serif;
    font-size:36px;font-weight:700;line-height:1.15;letter-spacing:.5px;
  }
  @media (min-width:720px){ .contact__title{ font-size:50px; } }
  .contact__zh{font-size:19px;color:#cdd6e2;margin-top:8px;}
  @media (min-width:720px){ .contact__zh{ font-size:23px; } }
  .contact__rule{width:80px;height:5px;background:var(--olive);border-radius:3px;margin:20px 0 28px;}
  .contact__grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:8px;}
  @media (min-width:720px){ .contact__grid{ grid-template-columns:1fr 1fr;gap:28px; } }
  .contact__row{
    display:flex;align-items:flex-start;gap:14px;
    padding:14px 0;border-bottom:1px solid rgba(255,255,255,.15);
  }
  .contact__icon{font-size:24px;flex-shrink:0;margin-top:2px;color:var(--olive);}
  @media (min-width:720px){ .contact__icon{ font-size:28px; } }
  .contact__label{
    font-size:13px;color:#cdd6e2;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  }
  @media (min-width:720px){ .contact__label{ font-size:15px; } }
  .contact__value{
    font-size:18px;color:#fff;font-weight:600;margin-top:2px;line-height:1.45;

<script>
const QUIZ = [
  { q:'Which Roman ruler chose January as the first month of the year?',
    zh:'是哪一位羅馬統治者把一月定為一年的第一個月？',
    options:['Augustus','Julius Caesar','Constantine','Napoleon'], answer:1,
    explain:'凱撒大帝 Julius Caesar——約兩千年前改革了曆法。' },

  { q:'Whose calendar is the one most of the world uses today?',
    zh:'今天大部分國家使用的曆法是誰修訂的？',
    options:['Pope Gregory','King Henry','Emperor Qin','Empress Wu'], answer:0,
    explain:'教宗格雷格里十三世 Pope Gregory——1582 年修訂，稱為「格里曆」。' },

  { q:'Which word means "a chart that shows all the days of a year"?',
    zh:'哪一個單字代表「列出一年所有日子的表」？',
    options:['Resolution','Calendar','Countdown','Sparkler'], answer:1,
    explain:'"Calendar" 月曆——I hung a new calendar this morning。' },

  { q:'Which word means "12:00 at night, when one day becomes the next"?',
    zh:'哪一個單字代表「夜晚 12 點，一天變另一天的時刻」？',
    options:['Sunset','Midnight','Sunrise','Noon'], answer:1,
    explain:'"Midnight" 午夜——the moment of countdown。' },

  { q:'Which word means "a promise you make to yourself for the new year"?',
    zh:'哪一個單字代表「為新一年給自己的承諾」？',
    options:['Resolution','Countdown','Calendar','Fireworks'], answer:0,
    explain:'"Resolution" 新年新希望——my resolution is to read one book a month。' },

  { q:'Which word means "counting backward from ten to zero"?',
    zh:'哪一個單字代表「從十倒數到零」？',
    options:['Sparkler','Countdown','Resolution','Calendar'], answer:1,
    explain:'"Countdown" 倒數——10, 9, 8, 7…' },

  { q:'Which verb means "to do something special to mark a happy moment"?',
    zh:'哪一個動詞代表「為快樂時刻做特別的事」？',
    options:['Celebrate','Hide','Race','Carve'], answer:0,
    explain:'"Celebrate" 慶祝——We celebrate New Year together every year。' },

  { q:'Which adjective means "new, clean, and full of possibility"?',
    zh:'哪一個形容詞代表「全新、嶄新、充滿可能性的」？',
    options:['Tired','Old','Fresh','Sleepy'], answer:2,
    explain:'"Fresh" 全新的——January 1 feels like a fresh start。' },

  { q:'Which adjective means "very happy and full of energy about something coming"?',
    zh:'哪一個形容詞代表「對即將發生的事很興奮」？',
    options:['Tired','Excited','Quiet','Calm'], answer:1,
    explain:'"Excited" 興奮——I\'m excited for the new year to start。' },

  { q:'Child: "Let\'s ____ together! 10, 9, 8, 7…"',
    zh:'Roleplay 1：「我們一起 ____！10, 9, 8, 7…」',
    options:['count','sleep','race','sing'], answer:0,
    explain:'Scenario 1 用 count——倒數計時最常用的動詞。' },

  { q:'Owen: "I\'ll ____ mine too. A fresh year, a fresh start!"',
    zh:'Roleplay 2：「我也來 ____！全新的一年，全新的開始！」',
    options:['eat','plan','hide','sleep'], answer:1,
    explain:'Scenario 2 用 plan——計畫新年新希望。' },

  { q:'Cousin Hao: "I\'m so ____ about this year."',
    zh:'Roleplay 3：「我對今年充滿 ____。」',
    options:['hopeful','tired','sad','spooky'], answer:0,
    explain:'Scenario 3 用 hopeful——新年最重要的心情。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='A fresh year, a perfect start!'; msgZh='滿分！全新一年的完美開場。'; }
  else if(pct >= 80)   { emoji='🎆'; title='Excellent work!';  msgEn='Wonderful — a hopeful student ready for the new year!'; msgZh='做得很好！充滿希望地迎接新年。'; }
  else if(pct >= 60)   { emoji='📅'; title='Good effort!';     msgEn='Nice try — review the calendar story once more.'; msgZh='繼續加油！再看一次曆法的故事。'; }
  else                 { emoji='✨'; title='Keep practicing!'; msgEn="Don't give up — every year is a fresh start!"; msgZh='不要放棄！每一年都可以重新開始。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
