<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Two learning partners connecting across the globe by video">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a9bdc"/><stop offset="0.55" stop-color="#2a5fae"/><stop offset="1" stop-color="#1c3566"/>
    </linearGradient>
    <radialGradient id="globe" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#41c9b8"/><stop offset="1" stop-color="#138a86"/>
    </radialGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="2.2" opacity=".7"/><circle cx="120" cy="26" r="1.6" opacity=".5"/>
    <circle cx="250" cy="34" r="2" opacity=".6"/><circle cx="350" cy="22" r="1.6" opacity=".5"/>
    <circle cx="430" cy="52" r="2.4" opacity=".7"/><circle cx="404" cy="120" r="1.6" opacity=".45"/>
    <circle cx="44" cy="150" r="1.8" opacity=".5"/><circle cx="225" cy="250" r="1.8" opacity=".5"/>
  </g>
  <!-- globe -->
  <g transform="translate(132 172)">
    <ellipse cx="0" cy="84" rx="74" ry="12" fill="#0e2347" opacity=".35"/>
    <circle r="74" fill="url(#globe)" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.6">
      <ellipse rx="74" ry="26"/><ellipse rx="74" ry="50"/><ellipse rx="30" ry="74"/><ellipse rx="56" ry="74"/>
      <line x1="-74" y1="0" x2="74" y2="0"/>
    </g>
    <!-- simple continents -->
    <g fill="#1f9e6a" stroke="#0e7a52" stroke-width="1">
      <path d="M-44 -30 q14 -12 30 -4 q10 6 4 18 q-10 14 -28 8 q-14 -6 -6 -22 Z"/>
      <path d="M6 6 q22 -6 30 10 q6 16 -10 26 q-20 8 -28 -8 q-6 -18 8 -28 Z"/>
      <path d="M-28 34 q12 -4 16 8 q2 12 -12 14 q-12 0 -10 -12 q2 -8 6 -10 Z"/>
    </g>
    <!-- golden orbit ring -->
    <ellipse rx="92" ry="34" fill="none" stroke="#ffd56b" stroke-width="2.4" stroke-opacity=".9" transform="rotate(-18)"/>
  </g>
  <!-- video screen / partner on the right -->
  <g transform="translate(300 96)">
    <rect x="0" y="0" width="150" height="116" rx="16" fill="#ffffff" stroke="#ffd56b" stroke-width="3"/>
    <rect x="0" y="0" width="150" height="30" rx="16" fill="#2a5fae"/>
    <circle cx="14" cy="15" r="4" fill="#ff6b6b"/><circle cx="28" cy="15" r="4" fill="#ffd56b"/><circle cx="42" cy="15" r="4" fill="#41c9b8"/>
    <!-- friendly face -->
    <circle cx="75" cy="74" r="26" fill="#ffe0b8"/>
    <path d="M52 60 q23 -22 46 0" fill="#7a4a23"/>
    <circle cx="66" cy="72" r="3.4" fill="#3a2a1a"/><circle cx="84" cy="72" r="3.4" fill="#3a2a1a"/>
    <path d="M64 84 q11 10 22 0" fill="none" stroke="#b5562e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- golden dashed connection arc -->
  <path d="M196 120 Q260 40 320 92" fill="none" stroke="#ffd56b" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="3 11"/>
  <!-- chat bubbles -->
  <g>
    <g transform="translate(150 70)">
      <rect x="0" y="0" width="64" height="40" rx="13" fill="#ffffff"/>
      <path d="M14 38 l-2 12 l16 -10 Z" fill="#ffffff"/>
      <text x="32" y="26" font-family="'PingFang TC',sans-serif" font-size="17" font-weight="700" fill="#2a5fae" text-anchor="middle">你好!</text>
    </g>
    <g transform="translate(286 36)">
      <rect x="0" y="0" width="58" height="38" rx="13" fill="#ffd56b"/>
      <path d="M44 36 l4 12 l-16 -8 Z" fill="#ffd56b"/>
      <text x="29" y="25" font-family="'Playfair Display',serif" font-size="18" font-weight="800" fill="#1c3566" text-anchor="middle">Hi!</text>
    </g>
  </g>
</svg>
