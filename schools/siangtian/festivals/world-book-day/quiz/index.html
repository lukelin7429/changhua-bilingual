<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival 06 Quiz · World Book Day · Festival English Series</title>
<meta name="description" content="Festival 06 Quiz — World Book Day. 12 questions on origins, reading vocabulary, classroom activities, and roleplay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paddy:#527a3e;
    --paddy-deep:#2f4d24;
    --paddy-soft:#dde9d3;
    --rice:#c8a13a;
    --rice-deep:#8a6a1c;
    --rice-soft:#f5ecd3;
    --gold:#caa056;
    --gold-soft:#f7eed9;
    --sky-soft:#e3eef5;
    --cream:#ffffff;
    --ink:#1f1a16;
    --ink-soft:#5e5750;
    --line:#e7dfd2;
    --max:1140px;
    --shadow:0 14px 40px -16px rgba(47,77,36,.28);
    --shadow-sm:0 4px 14px -4px rgba(47,77,36,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
    color:var(--ink);
    background:#fff;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:var(--paddy-deep);text-decoration:none;transition:color .2s;}
  a:hover{color:var(--rice-deep);}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}

  /* ============ SUB-NAV ============ */
  .subnav{
    background:var(--paddy-soft);
    padding:14px 0;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .subnav__inner{
    display:flex;flex-wrap:wrap;gap:6px 18px;
    justify-content:center;align-items:center;
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:18px;
  }
  @media (min-width:720px){ .subnav__inner{ font-size:20px; } }
  .subnav a{
    color:var(--paddy-deep);text-decoration:none;font-weight:600;
    padding:5px 12px;border-radius:20px;transition:all .15s;white-space:nowrap;
  }
  .subnav a:hover{background:#fff;color:var(--rice-deep);}
  .subnav a.is-active{background:var(--paddy-deep);color:#fff;}
  .subnav__sep{color:var(--ink-soft);opacity:.4;}
  @media (max-width:600px){ .subnav__sep{display:none;} }

  /* ============ BANNER — full-bleed photo ============ */
  .banner{
    position:relative;
    background:#1a2e12 url('photos/banner-aerial.jpg') center 55%/cover no-repeat;
    min-height:240px;display:flex;align-items:flex-end;overflow:hidden;
  }
  @media(min-width:720px){ .banner{ min-height:340px; } }
  @media(min-width:1080px){ .banner{ min-height:400px; } }
  .banner::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 0%, transparent 45%, rgba(20,40,12,.72) 100%);
    pointer-events:none;
  }
  .banner__inner{
    position:relative;z-index:1;width:100%;max-width:var(--max);margin:0 auto;
    padding:28px 24px 22px;color:#fff;
    display:flex;align-items:flex-end;gap:14px;
  }
  @media(min-width:720px){ .banner__inner{ padding:44px 36px 34px;gap:20px; } }
  .banner__text{flex:1;min-width:0;}
  .banner__brand{
    font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;
    color:#f5e5b0;font-weight:700;margin-bottom:10px;
  }
  @media(min-width:720px){ .banner__brand{ font-size:14.5px; } }
  .banner h1{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:40px;font-weight:600;line-height:1.05;letter-spacing:.01em;
    text-shadow:0 3px 18px rgba(0,0,0,.45);
  }
  @media(min-width:720px){ .banner h1{ font-size:62px; } }
  @media(min-width:1080px){ .banner h1{ font-size:76px; } }
  .banner__zh{
    font-size:17px;color:#d8ecd0;margin-top:6px;font-weight:500;letter-spacing:.08em;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
  }
  @media(min-width:720px){ .banner__zh{ font-size:22px; } }
  .banner__tagline{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:17px;color:#f0f8e8;margin-top:12px;line-height:1.5;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  @media(min-width:720px){ .banner__tagline{ font-size:21px; } }
  .banner__tagline .tagline-zh{
    display:block;font-style:normal;
    font-family:'PingFang TC',sans-serif;
    font-size:14px;margin-top:5px;color:#d8ecd0;letter-spacing:.06em;
  }
  @media(min-width:720px){ .banner__tagline .tagline-zh{ font-size:17px; } }
  .banner__logo{
    flex-shrink:0;align-self:flex-end;
    width:50px;height:50px;border-radius:11px;
    background:#fff;padding:3px;
    box-shadow:0 6px 20px -5px rgba(0,0,0,.5);
  }
  @media(min-width:720px){ .banner__logo{ width:66px;height:66px;padding:4px; } }
  .banner__logo img{width:100%;height:100%;border-radius:8px;display:block;object-fit:contain;}

  /* ============ Section base ============ */
  section{padding:90px 0;}
  .section-head{text-align:center;margin-bottom:60px;}
  .section-head .eyebrow{
    display:inline-block;
    color:var(--rice-deep);font-size:15px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;
    margin-bottom:14px;
  }
  .section-head h2{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:clamp(42px,6vw,62px);
    font-weight:600;color:var(--paddy-deep);line-height:1.2;
    margin-bottom:8px;
  }
  .section-head .h2-zh{
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
    font-size:22.5px;color:var(--ink-soft);
    font-weight:500;letter-spacing:.04em;
  }
  .section-head .lede{
    color:var(--ink-soft);font-size:19.5px;
    max-width:640px;margin:18px auto 0;
  }

  /* ============ About ============ */
  .about{background:#fff;}
  .about-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:50px;align-items:start;
  }
  .about-photos{
    display:grid;
    grid-template-rows:auto auto;
    gap:14px;
  }
  .about-photo{
    position:relative;
    border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);
    aspect-ratio:4/3;
    background:var(--paddy-soft);
  }
  .about-photo img{
    width:100%;height:100%;object-fit:cover;
  }
  .about-photo .badge{
    position:absolute;
    top:14px;left:14px;
    background:var(--gold);
    color:var(--ink);
    padding:5px 12px;border-radius:99px;
    font-size:14px;font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    z-index:2;
  }
  .about-photo .caption{
    position:absolute;
    bottom:0;left:0;right:0;
    background:linear-gradient(0deg,rgba(15,26,12,.82) 0%,transparent 100%);
    color:#fff;
    padding:18px 16px 12px;
    font-size:15.5px;
    font-family:'PingFang TC',sans-serif;
  }
  .about-photo .caption .en{
    font-style:italic;font-family:'Cormorant Garamond',serif;
    font-size:17.5px;display:block;margin-bottom:2px;
    color:rgba(255,255,255,.95);
  }
  .about-text h3{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:37.5px;color:var(--paddy-deep);
    line-height:1.25;margin-bottom:18px;font-weight:600;
  }
  .about-text .en{font-size:20px;color:var(--ink);margin-bottom:18px;}
  .about-text .zh-divider{
    height:1px;background:var(--line);
    margin:24px 0;
    position:relative;
  }
  .about-text .zh-divider::before{
    content:"中文 / 中文";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    padding:0 14px;
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
  }
  .about-text .zh{
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
    font-size:19.5px;color:var(--ink);line-height:1.85;
  }
  .about-text .quick{
    background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:20px 22px;margin-top:26px;
    box-shadow:var(--shadow-sm);
  }
  .about-text .quick dt{
    font-size:14px;font-weight:700;color:var(--rice-deep);
    letter-spacing:.14em;text-transform:uppercase;
    margin-top:6px;
  }
  .about-text .quick dd{
    font-size:18px;color:var(--ink);
    margin:2px 0 12px;
    font-family:'PingFang TC',sans-serif;
  }
  .about-text .quick dd:last-child{margin-bottom:0;}

  /* ============ Identity (3 pillars) ============ */
  .identity{background:linear-gradient(180deg,var(--cream) 0%,var(--paddy-soft) 100%);}
  .pillars{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:26px;
  }
  .pillar{
    background:#fff;border-radius:18px;
    padding:36px 30px 32px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    transition:transform .25s,box-shadow .25s,border-color .25s;
    position:relative;
  }
  .pillar:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
    border-color:var(--paddy);
  }
  .pillar .icon{
    width:54px;height:54px;border-radius:14px;
    background:var(--rice-soft);color:var(--rice-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:32.5px;font-weight:700;
    font-family:'Cormorant Garamond',serif;
    margin-bottom:22px;
  }
  .pillar:nth-child(2) .icon{background:var(--paddy-soft);color:var(--paddy-deep);}
  .pillar:nth-child(3) .icon{background:var(--gold-soft);color:#8b6a17;}
  .pillar h3{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:30px;color:var(--paddy-deep);
    line-height:1.25;font-weight:600;margin-bottom:6px;
  }
  .pillar h3 small{
    display:block;
    font-family:'PingFang TC',sans-serif;
    font-size:17.5px;color:var(--ink-soft);
    font-weight:500;margin-top:4px;letter-spacing:.04em;
  }
  .pillar .en-body{
    font-size:18px;color:var(--ink);
    margin:18px 0;line-height:1.7;
  }
  .pillar .divider-tiny{
    height:1px;background:var(--line);
    margin:14px 0;
  }
  .pillar .zh-body{
    font-family:'PingFang TC',sans-serif;
    font-size:18px;color:var(--ink);line-height:1.85;
  }

  /* ============ Principal ============ */
  .principal{background:#fff;}
  .principal-card{
    display:grid;
    grid-template-columns:.85fr 1.4fr;
    gap:50px;align-items:center;
    background:#fff;border-radius:22px;
    padding:50px;border:1px solid var(--line);
    box-shadow:var(--shadow);
    max-width:1000px;margin:0 auto;
  }
  .principal-photo{
    position:relative;
    border-radius:16px;overflow:hidden;
    aspect-ratio:1/1;
    box-shadow:var(--shadow-sm);
    background:var(--paddy-soft);
  }
  .principal-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:center 18%;
  }
  .principal-text .role{
    color:var(--rice-deep);font-size:14.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;
    margin-bottom:10px;
  }
  .principal-text h3{
    font-family:'Cormorant Garamond',serif;
    font-size:40px;font-weight:600;color:var(--paddy-deep);
    line-height:1.15;margin-bottom:6px;
  }
  .principal-text h3 small{
    display:block;
    font-family:'PingFang TC',sans-serif;
    font-size:22.5px;color:var(--ink-soft);
    font-weight:500;margin-top:6px;
  }
  .principal-text blockquote{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22.5px;color:var(--ink);
    line-height:1.65;margin:24px 0 14px;
    padding-left:22px;
    border-left:3px solid var(--gold);
  }
  .principal-text .zh-quote{
    font-family:'PingFang TC',sans-serif;
    font-style:normal;
    font-size:19.5px;color:var(--ink);
    line-height:1.85;
    padding-left:22px;
    border-left:3px solid var(--paddy);
    margin-top:18px;
  }
  .she-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:14px;margin-top:26px;
  }
  .she-grid .she-cell{
    background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px 14px 16px;
    text-align:center;
  }
  .she-grid .she-letter{
    font-family:'Cormorant Garamond',serif;
    font-size:45px;font-weight:600;line-height:1;
    color:var(--paddy-deep);margin-bottom:4px;
  }
  .she-grid .she-en{
    font-size:14px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--rice-deep);
  }
  .she-grid .she-zh{
    font-family:'PingFang TC',sans-serif;
    font-size:15.5px;color:var(--ink-soft);
    margin-top:4px;letter-spacing:.06em;
  }

  /* ============ Student Life ============ */
  .life{background:linear-gradient(180deg,var(--paddy-soft) 0%,var(--cream) 100%);}
  .life-grid{

  .visit{background:var(--paddy-deep);color:#fff;padding:80px 0;}

  .visit h2 small{
    display:block;
    font-family:'PingFang TC',sans-serif;

  .visit p{font-size:19px;color:rgba(255,255,255,.85);margin-top:20px;line-height:1.75;}

  .contact dd a{color:#fff;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px;}
  .contact dd a:hover{color:var(--gold-soft);border-color:var(--gold-soft);}

  /* ============ Footer ============ */
  footer{
    background:#0f1a0c;color:rgba(255,255,255,.65);

  footer .partner{color:var(--gold-soft);font-weight:600;}

  /* ============ Mobile ============ */
  @media (max-width: 880px) {
    .title{padding:42px 0 28px;}
    section{padding:64px 0;}
    .about-grid{grid-template-columns:1fr;gap:36px;}

  /* reveal-fx */
  .rvl{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);}
  .rvl.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.rvl{opacity:1!important;transform:none!important;}}

<script>
const QUIZ = [
  { q:'On what date is World Book Day celebrated each year?',
    zh:'世界閱讀日是每年的哪一天？',
    options:['March 23','April 23','May 23','June 23'], answer:1,
    explain:'4 月 23 日——莎士比亞與賽萬提斯同日逝世的紀念日。' },

  { q:'Which two famous writers both died on April 23, 1616?',
    zh:'哪兩位著名作家在 1616 年 4 月 23 日同日辭世？',
    options:['Hemingway and Tolstoy','Shakespeare and Cervantes','Dickens and Austen','Tagore and Lu Xun'], answer:1,
    explain:'Shakespeare (英) 與 Cervantes (西)——UNESCO 為紀念他們設立此節。' },

  { q:'Which word means "the person who wrote a book"?',
    zh:'哪一個單字代表「寫書的人」？',
    options:['Reader','Author','Librarian','Critic'], answer:1,
    explain:'"Author" 作者——my favorite author writes funny stories。' },

  { q:'Which word means "one part of a book, with its own title"?',
    zh:'哪一個單字代表「書中各自有標題的一部分」？',
    options:['Page','Chapter','Cover','Index'], answer:1,
    explain:'"Chapter" 章節——I finished chapter three。' },

  { q:'Which word means "a long story book, often made up by the author"?',
    zh:'哪一個單字代表「作者虛構的長篇故事書」？',
    options:['Dictionary','Magazine','Novel','Atlas'], answer:2,
    explain:'"Novel" 小說——通常較長、有完整情節。' },

  { q:'Which verb means "to take a book and return it later"?',
    zh:'哪一個動詞是「借書、之後再還」？',
    options:['Buy','Borrow','Hide','Wrap'], answer:1,
    explain:'"Borrow" 借——you can borrow up to five books from the library。' },

  { q:'Which verb means "to tell someone a book is worth trying"?',
    zh:'哪一個動詞是「告訴別人某本書值得讀」？',
    options:['Sell','Hide','Recommend','Race'], answer:2,
    explain:'"Recommend" 推薦——I recommend this novel。' },

  { q:'Which adjective means "loving to read and learn from books"?',
    zh:'哪一個形容詞代表「愛看書、愛從書中學習」？',
    options:['Bookish','Loud','Lazy','Sleepy'], answer:0,
    explain:'"Bookish" 愛看書的——my older sister is very bookish。' },

  { q:'Which adjective means "wanting to learn or know more"?',
    zh:'哪一個形容詞代表「好奇、想知道更多」？',
    options:['Tired','Curious','Bored','Hungry'], answer:1,
    explain:'"Curious" 好奇——a curious reader always asks "why?"' },

  { q:'In which Spanish region did the "rose and book" tradition begin?',
    zh:'「玫瑰與書」的傳統最早出自西班牙的哪一個地區？',
    options:['Andalusia','Catalonia','Madrid','Basque'], answer:1,
    explain:'Catalonia 加泰隆尼亞——情人節般的書與玫瑰互贈傳統。' },

  { q:'Ann: "Hey, I just finished a really ____ book. Want me to recommend it?"',
    zh:'Roleplay 1：「我剛讀完一本很 ____ 的書，要不要推薦給你？」',
    options:['boring','inspiring','heavy','loud'], answer:1,
    explain:'Scenario 1 用 inspiring——啟發人心的書才值得推薦。' },

  { q:'Librarian: "What are you ____ about?"',
    zh:'Roleplay 2 館員：「你對什麼很 ____ 呢？」',
    options:['hungry','curious','noisy','sleepy'], answer:1,
    explain:'Scenario 2 用 curious——好奇是選書的最佳起點。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Books open every door for you!'; msgZh='滿分！書本為你打開所有的門。'; }
  else if(pct >= 80)   { emoji='📖'; title='Excellent work!';  msgEn='Wonderful — a true reader at heart!'; msgZh='做得很好！真正的書蟲。'; }
  else if(pct >= 60)   { emoji='🌹'; title='Good effort!';     msgEn='Nice try — read the handout once more.'; msgZh='繼續加油！再回去看一次講義。'; }
  else                 { emoji='📚'; title='Keep practicing!'; msgEn="Don't give up — every reader starts somewhere!"; msgZh='不要放棄！每位讀者都是這樣開始的。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
