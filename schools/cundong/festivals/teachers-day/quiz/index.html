<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival 11 Quiz · Teachers' Day · Festival English Series</title>
<meta name="description" content="Festival 11 Quiz — Teachers' Day. 12 questions on Confucius, vocabulary, traditions, and roleplay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1F94D9;
    --brand-deep:#1860A8;
    --brand-soft:#E8F2FA;
    --brand-pale:#A8D8F0;
    --red:#C6070F;
    --red-soft:#FBE9EA;
    --gold:#E8B948;
    --leaf:#6E9239;
    --ink:#0F1A22;
    --ink-soft:#5A6772;
    --line:#DCE6EE;
    --bg-soft:#F4F8FC;
    --max:1140px;
    --shadow:0 18px 50px -22px rgba(24,96,168,.35);
    --shadow-sm:0 4px 14px -4px rgba(24,96,168,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;color:var(--ink);background:#fff;font-size:20px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ body{ font-size:23px; } }
  img{max-width:100%;display:block;}
  a{color:var(--brand-deep);text-decoration:none;transition:color .2s;}
  a:hover{color:var(--brand);}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}
  h1,h2,h3,h4{font-family:'Fraunces','Inter','PingFang TC',serif;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  h1{font-size:48px;line-height:1.05;}
  @media (min-width:720px){ h1{ font-size:74px; } }
  h2{font-size:38px;line-height:1.15;}
  @media (min-width:720px){ h2{ font-size:58px; } }
  h3{font-size:28px;line-height:1.2;}
  @media (min-width:720px){ h3{ font-size:34px; } }
  h4{font-size:22px;line-height:1.3;}
  p{font-size:20px;line-height:1.75;}
  @media (min-width:720px){ p{ font-size:22px; } }
  .zh{font-family:'PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;letter-spacing:.02em;}

  /* ============ TOPBAR ============ */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 28px;max-width:var(--max);margin:0 auto;}
  .topbar-brand{display:flex;align-items:center;gap:12px;}
  .topbar-brand img{width:42px;height:42px;}
  .topbar-name{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.15;color:var(--ink);}
  .topbar-name small{display:block;font-family:'PingFang TC',sans-serif;font-size:16px;color:var(--ink-soft);font-weight:400;letter-spacing:.04em;margin-top:2px;}
  .topbar-nav{display:flex;gap:4px;flex-wrap:wrap;}
  .topbar-nav a{font-size:18px;font-weight:500;color:var(--ink-soft);padding:8px 12px;border-radius:8px;transition:all .15s ease;}
  .topbar-nav a:hover,.topbar-nav a.is-active{color:var(--brand-deep);background:var(--brand-soft);}
  @media (max-width:760px){.topbar-nav a{font-size:16px;padding:6px 9px;}}

  /* ============ HERO ============ */
  .hero{
    position:relative;
    min-height:540px;
    color:#fff;
    background:
      linear-gradient(180deg, rgba(24,96,168,0) 0%, rgba(24,96,168,0) 48%, rgba(24,96,168,.55) 100%),
      url('photos/campus-mural-blue.jpg') center / cover no-repeat;text-shadow:0 1px 2px rgba(0,0,0,.55),0 2px 14px rgba(0,0,0,.5);/*scrim-shadow*/
    display:flex;align-items:center;
    padding:90px 0 100px;
  }
  .hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--brand) 0%,var(--red) 50%,var(--brand) 100%);}
  .hero-eyebrow{display:inline-block;padding:7px 16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;font-size:18px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px;font-weight:500;}
  .hero h1{color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.25);max-width:820px;}
  .hero h1 .zh-line{display:block;font-family:'PingFang TC',sans-serif;font-size:26px;font-weight:500;margin-top:18px;letter-spacing:.06em;opacity:.95;}
  @media (min-width:720px){ .hero h1 .zh-line{ font-size:34px; } }
  .hero-tag{margin-top:28px;font-size:22px;max-width:700px;opacity:.95;line-height:1.55;}
  @media (min-width:720px){ .hero-tag{ font-size:25px; } }
  .hero-tag .zh{display:block;margin-top:8px;font-size:20px;opacity:.88;}
  @media (min-width:720px){ .hero-tag .zh{ font-size:22px; } }
  .hero-facts{display:flex;gap:28px 40px;flex-wrap:wrap;margin-top:40px;}
  .hero-fact{font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;opacity:.92;}
  @media (min-width:720px){ .hero-fact{ font-size:17px; } }
  .hero-fact span{display:block;font-size:24px;letter-spacing:0;text-transform:none;font-family:'Fraunces',serif;margin-top:4px;}
  @media (min-width:720px){ .hero-fact span{ font-size:28px; } }

  /* ============ SECTION HEAD ============ */
  .section-head{margin-bottom:48px;}
  .section-head.center{text-align:center;}
  .eyebrow{display:inline-block;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);font-weight:600;margin-bottom:14px;}
  @media (min-width:720px){ .eyebrow{ font-size:19px; } }
  .h2-zh{font-family:'PingFang TC',sans-serif;font-size:22px;font-weight:500;color:var(--ink-soft);margin-top:12px;letter-spacing:.05em;}
  @media (min-width:720px){ .h2-zh{ font-size:26px; } }

  /* ============ ABOUT (yangming-style: photo banner + single-column EN/ZH interleaved) ============ */
  .about{padding:96px 0 90px;}
  .about-quote{max-width:920px;margin:0 auto 40px;text-align:center;}
  .about-quote q{font-family:'Fraunces',serif;font-style:italic;font-size:32px;font-weight:600;line-height:1.4;color:var(--brand-deep);quotes:'"' '"';}
  @media (min-width:720px){ .about-quote q{ font-size:46px; } }
  .about-quote q::before,.about-quote q::after{color:var(--brand);opacity:.7;}

  /* Wide photo banner (full wrap width) */
  .about-photos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:54px;}
  @media (max-width:680px){.about-photos{grid-template-columns:1fr;}}
  .about-photo{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;}
  .about-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .about-photo .caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(15,26,34,.9) 0%,rgba(15,26,34,0) 100%);color:#fff;padding:42px 24px 20px;font-size:18px;}
  @media (min-width:720px){ .about-photo .caption{ font-size:20px; } }
  .about-photo .caption .en{display:block;font-weight:600;margin-bottom:3px;}
  .about-photo .caption .zh{display:block;font-size:16px;opacity:.92;}
  @media (min-width:720px){ .about-photo .caption .zh{ font-size:17px; } }

  /* Body uses the full wrap width — no extra max-width constraint */
  .about-body p{font-size:20px;line-height:1.75;color:var(--ink);margin-bottom:20px;}
  @media (min-width:720px){ .about-body p{ font-size:22px; } }
  .about-body p.zh{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink-soft);font-size:19px;margin-top:-8px;margin-bottom:30px;}
  @media (min-width:720px){ .about-body p.zh{ font-size:21px; } }
  .about-body p strong{color:var(--brand-deep);}

  /* ============ PILLARS (6 photo cards) ============ */
  .pillars-section{padding:96px 0;background:var(--bg-soft);}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  @media (max-width:1000px){.pillars{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.pillars{grid-template-columns:1fr;}}
  .pillar{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
  .pillar:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .pillar-photo{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--bg-soft);}
  .pillar-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease;}
  .pillar:hover .pillar-photo img{transform:scale(1.03);}
  .pillar-body{padding:26px 26px 28px;display:flex;flex-direction:column;flex:1;}
  @media (min-width:720px){ .pillar-body{ padding:30px 30px 32px; } }
  .pillar-label{font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--brand);margin-bottom:10px;}
  @media (min-width:720px){ .pillar-label{ font-size:17px; } }
  .pillar h3{font-size:26px;line-height:1.2;margin-bottom:6px;}
  @media (min-width:720px){ .pillar h3{ font-size:30px; } }
  .pillar h3 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:18px;font-weight:500;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em;}
  @media (min-width:720px){ .pillar h3 .zh{ font-size:21px; } }
  .pillar-body p{font-size:19px;margin-top:14px;color:var(--ink);line-height:1.6;flex:1;}
  @media (min-width:720px){ .pillar-body p{ font-size:20px; } }

  /* ============ SPOTLIGHT (full-bleed photo banner + single-column text) ============ */
  .spotlight{padding:0;}
  .spotlight.is-gold{background:linear-gradient(180deg,#FFFCEF 0%,#fff 100%);}
  .spotlight-banner{position:relative;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:0;}
  @media (max-width:760px){.spotlight-banner{grid-template-columns:1fr;}}
  .spotlight-banner .ph{position:relative;aspect-ratio:3/2;overflow:hidden;}
  @media (min-width:761px){.spotlight-banner .ph{aspect-ratio:auto;height:460px;}}
  .spotlight-banner .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .spotlight-banner .badge{position:absolute;top:24px;left:24px;background:var(--red);color:#fff;font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 18px rgba(198,7,15,.35);}
  @media (min-width:720px){ .spotlight-banner .badge{ font-size:17px; } }
  .spotlight.is-gold .spotlight-banner .badge{background:#A07A14;box-shadow:0 6px 18px rgba(160,122,20,.35);}

  .spotlight-text{padding:80px 0 90px;}
  .spotlight-text .inner{max-width:var(--max);margin:0 auto;padding:0 28px;}
  .spotlight-text .label{font-size:17px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:14px;}
  @media (min-width:720px){ .spotlight-text .label{ font-size:19px; } }
  .spotlight.is-gold .spotlight-text .label{color:#A07A14;}
  .spotlight-text h2{color:var(--ink);margin-bottom:8px;}
  .spotlight-text h2 .zh{display:block;font-family:'PingFang TC',sans-serif;font-size:22px;font-weight:500;color:var(--ink-soft);margin-top:10px;letter-spacing:.05em;}
  @media (min-width:720px){ .spotlight-text h2 .zh{ font-size:26px; } }
  .spotlight-text .body{margin-top:32px;}
  .spotlight-text .body p{font-size:20px;line-height:1.75;color:var(--ink);margin-bottom:20px;}
  @media (min-width:720px){ .spotlight-text .body p{ font-size:22px; } }
  .spotlight-text .body p.zh{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink-soft);font-size:19px;margin-top:-8px;margin-bottom:30px;}
  @media (min-width:720px){ .spotlight-text .body p.zh{ font-size:21px; } }
  .spotlight-text .body p strong{color:var(--ink);font-weight:700;}

  /* ============ MAE CTA card ============ */
  .mae-cta-section{padding:80px 0;background:#fff;}
  .mae-card{background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand) 100%);color:#fff;border-radius:24px;padding:48px 44px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  @media (min-width:720px){ .mae-card{ padding:60px 56px; } }
  .mae-card::after{content:"a-Mae-zing";position:absolute;right:-30px;bottom:-50px;font-family:'Fraunces',serif;font-size:180px;font-weight:700;opacity:.07;color:#fff;letter-spacing:-.04em;line-height:1;pointer-events:none;}
  .mae-card .eyebrow{color:var(--brand-pale);}
  .mae-card h2{color:#fff;max-width:720px;}
  .mae-card .zh-sub{font-family:'PingFang TC',sans-serif;font-size:21px;color:var(--brand-pale);margin-top:10px;letter-spacing:.05em;}
  @media (min-width:720px){ .mae-card .zh-sub{ font-size:25px; } }
  .mae-card p.lead{font-size:21px;max-width:720px;margin-top:22px;opacity:.96;line-height:1.7;}
  @media (min-width:720px){ .mae-card p.lead{ font-size:23px; } }
  .mae-buttons{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;position:relative;z-index:2;}
  .mae-btn{display:inline-block;padding:16px 30px;background:#fff;color:var(--brand-deep);border-radius:999px;font-weight:600;font-size:19px;letter-spacing:.02em;transition:transform .15s;}
  @media (min-width:720px){ .mae-btn{ font-size:21px; } }

  .visit-links{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;}
  .visit-links a{display:inline-block;padding:10px 18px;background:#fff;color:var(--brand-deep);border-radius:8px;font-size:17px;font-weight:600;transition:background .15s;border:1px solid var(--brand-pale);}
  @media (min-width:720px){ .visit-links a{ font-size:19px; } }

  /* ============ FOOTER ============ */
  footer{background:var(--ink);color:rgba(255,255,255,.78);padding:54px 0 34px;font-size:18px;}
  @media (min-width:720px){ footer{ font-size:19px; } }
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  footer .foot-brand{display:flex;align-items:center;gap:14px;}
  footer .foot-brand img{width:42px;height:42px;}
  footer .foot-name{font-family:'Fraunces',serif;font-weight:600;color:#fff;font-size:22px;}
  footer .foot-name small{display:block;font-family:'PingFang TC',sans-serif;font-weight:400;font-size:16px;color:rgba(255,255,255,.6);margin-top:2px;}
  footer .foot-meta{font-size:18px;text-align:right;color:rgba(255,255,255,.6);}
  @media (min-width:720px){ footer .foot-meta{ font-size:19px; } }
  footer a{color:rgba(255,255,255,.95);font-weight:600;}

  /* reveal-fx */
  .rvl{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);}

      <span class="th-fest-hero__eyebrow">Quiz · 小測驗</span>

<div class="quiz-wrap">
  <main class="card" id="quiz-card">
    <div class="progress">
      <div class="progress__no" id="qno">Question 1 / 12</div>
      <div class="progress__bar"><div class="progress__fill" id="bar"></div></div>
    </div>
    <div class="question" id="question">Loading…</div>
    <div class="question__zh" id="question-zh"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </main>

  <main class="card result" id="result-card" style="display:none;">
    <div class="result__emoji" id="r-emoji">🎓</div>
    <div class="result__title" id="r-title">Happy Teachers' Day!</div>
    <div class="result__score">
      <span id="r-score">0</span> / <span id="r-total">12</span>
      <small id="r-pct">(0%)</small>
    </div>
    <p class="result__msg" id="r-msg-en">You did great!</p>
    <p class="result__zh" id="r-msg-zh">完成了！</p>
    <div class="result__actions">
      <button class="btn btn--primary" id="btn-restart">Try again · 再試一次</button>
      <a class="btn btn--ghost" href="../">← Back to handout · 回講義</a>
    </div>
  </main>

  </div>

<script>
const QUIZ = [
  { q:'Who is the wise teacher Taiwan honors on September 28?',
    zh:'臺灣在 9 月 28 日是為了紀念哪一位智慧的老師？',
    options:['Qu Yuan','Confucius','Hou Yi','Jie Zitui'], answer:1,
    explain:'孔子 Confucius——華人教育的奠基者，9/28 是他的生日。' },

  { q:'About how many years ago was Confucius born?',
    zh:'孔子大約是幾年前出生的？',
    options:['500 years ago','2,500 years ago','5,000 years ago','100 years ago'], answer:1,
    explain:'約兩千五百年前出生於魯國。' },

  { q:'Which word means "the ability to make wise choices"?',
    zh:'哪一個單字代表「能夠做出明智判斷的能力」？',
    options:['Wisdom','Lesson','Saying','Temple'], answer:0,
    explain:'"Wisdom" 智慧——Confucius\'s wisdom is still useful today。' },

  { q:'Which word means "a short famous sentence that people remember"?',
    zh:'哪一個單字代表「眾人朗朗上口的名言」？',
    options:['Lesson','Saying','Wisdom','Temple'], answer:1,
    explain:'"Saying" 名言／格言——孔子的論語有很多 sayings。' },

  { q:'Which verb means "to give someone hope or courage to keep trying"?',
    zh:'哪一個動詞代表「讓某人有勇氣繼續努力」？',
    options:['Hide','Encourage','Teach','Learn'], answer:1,
    explain:'"Encourage" 鼓勵——teacher always encourages the shy students。' },

  { q:'Which adjective means "willing to wait calmly without getting upset"?',
    zh:'哪一個形容詞代表「能冷靜地等待、不發脾氣的」？',
    options:['Loud','Patient','Sleepy','Quick'], answer:1,
    explain:'"Patient" 有耐心的——好老師最重要的特質之一。' },

  { q:'Which adjective means "not thinking you are better than other people"?',
    zh:'哪一個形容詞代表「不覺得自己比別人厲害」？',
    options:['Proud','Humble','Loud','Rich'], answer:1,
    explain:'"Humble" 謙虛——even Confucius was humble enough to keep learning。' },

  { q:'About how many students did Confucius have in his lifetime?',
    zh:'孔子一生大約有多少弟子？',
    options:['Three hundred','Three thousand','Three million','Just thirty'], answer:1,
    explain:'弟子三千——其中七十二位賢人最有名。' },

  { q:'On Teachers\' Day morning, where do special ceremonies happen across Taiwan?',
    zh:'教師節早上，臺灣各地的特別典禮在哪裡舉行？',
    options:['On the beach','At Confucius temples','At the airport','Inside the post office'], answer:1,
    explain:'孔廟 Confucius temples——全臺都會舉辦祭孔典禮。' },

  { q:'Student: "You are the most ____ teacher I have ever had."',
    zh:'Roleplay 1：「你是我遇過最 ____ 的老師。」',
    options:['loud','patient','quick','tall'], answer:1,
    explain:'Scenario 1 用 patient——老師願意等待學生成長。' },

  { q:'Dad: "Confucius was ____ enough to keep learning from his students too."',
    zh:'Roleplay 2：「孔子 ____，連弟子的優點也願意學。」',
    options:['rich','humble','proud','sleepy'], answer:1,
    explain:'Scenario 2 用 humble——三人行必有我師焉。' },

  { q:'Big Brother: "You see? You can ____ anything if you stay calm."',
    zh:'Roleplay 3：「你看，只要冷靜，什麼都可以 ____。」',
    options:['learn','sell','hide','forget'], answer:0,
    explain:'Scenario 3 用 learn——學習從來不是天賦問題，而是冷靜。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Confucius would be proud of you!'; msgZh='滿分！孔子也會以你為榮。'; }
  else if(pct >= 80)   { emoji='🎓'; title='Excellent work!';  msgEn='Wonderful — a humble, hardworking student!'; msgZh='做得很好！是個謙虛又認真的學生。'; }
  else if(pct >= 60)   { emoji='📖'; title='Good effort!';     msgEn='Nice try — review the Confucius story once more.'; msgZh='繼續加油！再讀一次孔子的故事。'; }
  else                 { emoji='🏯'; title='Keep practicing!'; msgEn="Don't give up — go back to the handout and try again!"; msgZh='不要放棄！回去再讀一次講義就會了。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
