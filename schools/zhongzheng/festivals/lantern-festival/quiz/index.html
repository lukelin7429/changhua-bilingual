<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="canonical" href="https://changhua-bilingual.org/schools/zhongzheng/festivals/lantern-festival/quiz/">
<title>Festival 02 Quiz · Lantern Festival · Festival English Series</title>
<meta name="description" content="Festival 02 Quiz — Lantern Festival. 12 questions on vocabulary, traditions, and roleplay. Festival English Series for the Changhua Bilingual Hub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --honey:#C28A40;
    --honey-deep:#7a5217;
    --honey-soft:#faf0db;
    --jade:#2d6a4f;
    --jade-deep:#1b4332;
    --jade-soft:#dbeadd;
    --slate:#3a4a5c;
    --slate-soft:#e3e8ee;
    --ink:#1f1a16;
    --ink-soft:#5e5750;
    --line:#e7dfd2;
    --max:1140px;
    --shadow:0 14px 40px -16px rgba(122,82,23,.28);
    --shadow-sm:0 4px 14px -4px rgba(122,82,23,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
    color:var(--ink);
    background:#fff;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:var(--honey-deep);text-decoration:none;transition:color .2s;}
  a:hover{color:var(--jade);}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}

  /* ============ TITLE (gradient hero — no photo yet) ============ */
  .title{
    position:relative;
    background:
      linear-gradient(135deg,#1a1410 0%,#3a2814 45%,#7a5217 100%),
      radial-gradient(ellipse at top right,rgba(194,138,64,.4),transparent 60%);
    padding:90px 0 80px;
    text-align:center;
    color:#fff;
    border-bottom:4px solid var(--honey);
    overflow:hidden;
  }
  .title::after{
    content:"";position:absolute;
    inset:0;background:
      radial-gradient(circle at 80% 20%,rgba(194,138,64,.25),transparent 50%),
      radial-gradient(circle at 20% 80%,rgba(45,106,79,.15),transparent 50%);
    pointer-events:none;
  }
  .title > .wrap{position:relative;z-index:1;}
  .title__eyebrow{
    display:inline-block;
    font-size:13.5px;letter-spacing:.28em;
    color:rgba(255,236,196,.95);font-weight:700;
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .title h1{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:clamp(40px,7vw,64px);
    line-height:1.05;font-weight:600;letter-spacing:.005em;
    color:#fff;
    margin-bottom:6px;
    text-shadow:0 2px 16px rgba(0,0,0,.45);
  }
  .title .h1-zh{
    font-size:clamp(20px,2.6vw,26px);
    font-weight:500;letter-spacing:.08em;
    color:rgba(255,255,255,.9);
    margin-top:12px;
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
    text-shadow:0 1px 6px rgba(0,0,0,.35);
  }
  .title__divider{
    width:60px;height:2px;
    background:var(--honey);
    margin:24px auto 18px;
    border:0;
  }
  .title__tagline{
    max-width:600px;margin:0 auto;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:20px;
    color:rgba(255,255,255,.95);
    line-height:1.55;
  }
  .title__tagline .tagline-zh{
    display:block;
    font-style:normal;
    font-family:'PingFang TC',sans-serif;
    font-size:16.5px;
    margin-top:8px;
    color:rgba(255,255,255,.78);
    letter-spacing:.06em;
  }

  /* ============ Section base ============ */
  section{padding:90px 0;}
  .section-head{text-align:center;margin-bottom:60px;}
  .section-head .eyebrow{
    display:inline-block;
    color:var(--jade);font-size:14.5px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;
    margin-bottom:14px;
  }
  .section-head h2{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:clamp(40px,6vw,60px);
    font-weight:600;color:var(--honey-deep);line-height:1.2;
    margin-bottom:8px;
  }
  .section-head .h2-zh{
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
    font-size:22px;color:var(--ink-soft);
    font-weight:500;letter-spacing:.04em;
  }
  .section-head .lede{
    color:var(--ink-soft);font-size:19px;
    max-width:640px;margin:18px auto 0;
  }

  /* ============ About ============ */
  .about{background:#fff;}
  .about-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:50px;align-items:start;
  }
  .about-text h3{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:36px;color:var(--honey-deep);
    line-height:1.25;margin-bottom:18px;font-weight:600;
  }
  .about-text .en{font-size:19.5px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
  .about-text .zh-divider{
    height:1px;background:var(--line);
    margin:24px 0;
    position:relative;
  }
  .about-text .zh-divider::before{
    content:"中文 / 中文";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    padding:0 14px;
    font-size:13.5px;
    color:var(--ink-soft);
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
  }
  .about-text .zh{
    font-family:'PingFang TC','Apple LiGothic Medium',sans-serif;
    font-size:19px;color:var(--ink);line-height:1.85;
  }
  .about-text .zh p + p{margin-top:14px;}

  /* Lineage diagram (instead of about photo) */
  .lineage{
    background:linear-gradient(180deg,var(--honey-soft) 0%,#fff 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 30px;
    box-shadow:var(--shadow-sm);
  }
  .lineage__label{
    text-align:center;
    font-size:13px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;
    color:var(--honey-deep);
    margin-bottom:24px;
  }
  .lineage__trunk{
    background:#fff;border:2px solid var(--honey-deep);
    border-radius:14px;padding:18px 20px;text-align:center;
    margin:0 auto 14px;max-width:280px;
    box-shadow:var(--shadow-sm);
  }
  .lineage__trunk .name{
    font-family:'Cormorant Garamond',serif;
    font-size:21px;font-weight:600;color:var(--honey-deep);
    line-height:1.2;
  }
  .lineage__trunk .name-zh{
    font-family:'PingFang TC',sans-serif;
    font-size:15px;color:var(--ink-soft);margin-top:4px;
  }
  .lineage__trunk .year{
    font-size:12px;color:var(--jade);font-weight:700;
    letter-spacing:.14em;margin-top:6px;
  }
  .lineage__arrow{
    text-align:center;color:var(--honey);
    font-size:22px;line-height:1;
    margin:6px 0;
  }
  .lineage__seed{
    background:var(--honey);color:#fff;
    border-radius:14px;padding:20px 22px;text-align:center;
    margin:0 auto 18px;max-width:300px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .lineage__seed::before{
    content:"★";position:absolute;
    top:-12px;left:50%;transform:translateX(-50%);
    background:var(--honey-deep);color:#fff;
    width:26px;height:26px;border-radius:99px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .lineage__seed .name{
    font-family:'Cormorant Garamond',serif;
    font-size:23px;font-weight:700;
    line-height:1.2;
  }
  .lineage__seed .name-zh{
    font-family:'PingFang TC',sans-serif;
    font-size:16px;margin-top:4px;
    color:rgba(255,255,255,.92);
  }
  .lineage__seed .year{
    font-size:12.5px;color:rgba(255,255,255,.85);font-weight:700;
    letter-spacing:.14em;margin-top:6px;
  }
  .lineage__branches{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;margin-top:8px;
  }
  .lineage__branch{
    background:var(--jade-soft);
    border:1px solid var(--jade);
    color:var(--jade-deep);
    border-radius:10px;
    padding:12px 14px;text-align:center;
  }
  .lineage__branch .name{
    font-family:'Cormorant Garamond',serif;
    font-size:16.5px;font-weight:600;line-height:1.2;
  }
  .lineage__branch .name-zh{
    font-family:'PingFang TC',sans-serif;
    font-size:13px;color:var(--ink-soft);margin-top:2px;
  }
  .lineage__caption{
    margin-top:18px;text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:15.5px;color:var(--ink-soft);line-height:1.6;
  }
  .lineage__caption .zh{
    display:block;font-style:normal;
    font-family:'PingFang TC',sans-serif;
    font-size:14px;margin-top:4px;
  }

  /* ============ Identity (3 pillars) ============ */
  .identity{background:linear-gradient(180deg,#fff 0%,var(--honey-soft) 100%);}
  .pillars{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:26px;
  }
  .pillar{
    background:#fff;border-radius:18px;
    padding:36px 30px 32px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    transition:transform .25s,box-shadow .25s,border-color .25s;
    position:relative;
  }
  .pillar:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
    border-color:var(--honey);
  }
  .pillar .icon{
    width:54px;height:54px;border-radius:14px;
    background:var(--honey-soft);color:var(--honey-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:700;
    font-family:'Cormorant Garamond',serif;
    margin-bottom:22px;
  }
  .pillar:nth-child(2) .icon{background:var(--jade-soft);color:var(--jade-deep);}
  .pillar:nth-child(3) .icon{background:var(--slate-soft);color:var(--slate);}
  .pillar h3{
    font-family:'Cormorant Garamond','PingFang TC',serif;
    font-size:28px;color:var(--honey-deep);
    line-height:1.25;font-weight:600;margin-bottom:6px;
  }
  .pillar h3 small{
    display:block;
    font-family:'PingFang TC',sans-serif;
    font-size:17px;color:var(--ink-soft);
    font-weight:500;margin-top:4px;letter-spacing:.04em;
  }
  .pillar .en-body{
    font-size:17.5px;color:var(--ink);
    margin:18px 0 8px;line-height:1.7;
  }
  .pillar .divider-tiny{
    height:1px;background:var(--line);
    margin:14px 0;
  }
  .pillar .zh-body{
    font-family:'PingFang TC',sans-serif;
    font-size:17px;color:var(--ink);line-height:1.85;
  }

  /* ============ Principal ============ */
  .principal{background:#fff;}
  .principal-card{
    display:grid;
    grid-template-columns:.85fr 1.4fr;
    gap:50px;align-items:center;
    background:#fff;border-radius:22px;
    padding:50px;border:1px solid var(--line);
    box-shadow:var(--shadow);
    max-width:1000px;margin:0 auto;
  }
  .principal-photo{
    position:relative;
    border-radius:16px;overflow:hidden;
    aspect-ratio:1/1;
    box-shadow:var(--shadow-sm);
    background:linear-gradient(135deg,var(--honey-soft) 0%,#fff 60%,var(--jade-soft) 100%);
  }
  .principal-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:center 20%;
  }
  .principal-text .role{
    color:var(--jade);font-size:14px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;
    margin-bottom:10px;
  }
  .principal-text h3{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;font-weight:600;color:var(--honey-deep);
    line-height:1.15;margin-bottom:6px;
  }
  .principal-text h3 small{
    display:block;
    font-family:'PingFang TC',sans-serif;
    font-size:22px;color:var(--ink-soft);
    font-weight:500;margin-top:6px;
  }
  .principal-text .since{
    font-size:14.5px;color:var(--ink-soft);
    font-style:italic;margin-top:8px;
  }
  .principal-text blockquote{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;color:var(--ink);
    line-height:1.65;margin:26px 0 14px;
    padding-left:22px;
    border-left:3px solid var(--honey);
  }
  .principal-text .zh-quote{
    font-family:'PingFang TC',sans-serif;
    font-style:normal;
    font-size:19px;color:var(--ink);
    line-height:1.85;
    padding-left:22px;
    border-left:3px solid var(--jade);
    margin-top:18px;
  }
  .principal-cta{
    margin-top:24px;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border:1.5px solid var(--honey);
    border-radius:99px;color:var(--honey-deep);
    font-weight:600;font-size:15px;letter-spacing:.04em;
    transition:background .2s,color .2s;
  }
  .principal-cta:hover{background:var(--honey);color:#fff;}

  /* ============ Student Life ============ */
  .life{background:linear-gradient(180deg,var(--honey-soft) 0%,#fff 100%);}
  .life-grid{

  @media (max-width: 880px) {

  @media (max-width:560px){

<header class="th-fest-hero">

      <span class="th-fest-hero__eyebrow">Quiz · 小測驗</span>

<div class="quiz-wrap">
  <main class="card" id="quiz-card">
    <div class="progress">
      <div class="progress__no" id="qno">Question 1 / 12</div>
      <div class="progress__bar"><div class="progress__fill" id="bar"></div></div>
    </div>
    <div class="question" id="question">Loading…</div>
    <div class="question__zh" id="question-zh"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </main>

  <main class="card result" id="result-card" style="display:none;">
    <div class="result__emoji" id="r-emoji">🏮</div>
    <div class="result__title" id="r-title">Happy Lantern Festival!</div>
    <div class="result__score">
      <span id="r-score">0</span> / <span id="r-total">12</span>
      <small id="r-pct">(0%)</small>
    </div>
    <p class="result__msg" id="r-msg-en">You did great!</p>
    <p class="result__zh" id="r-msg-zh">完成了！</p>
    <div class="result__actions">
      <button class="btn btn--primary" id="btn-restart">Try again · 再試一次</button>
      <a class="btn btn--ghost" href="../">← Back to handout · 回講義</a>
    </div>
  </main>

  </div>

<script>
const QUIZ = [
  { q:'Which word means "a clever question with a hidden answer"?',
    zh:'哪一個單字代表「有藏答案的聰明問題」？',
    options:['Display','Riddle','Parade','Wish'], answer:1,
    explain:'"Riddle" 謎語——元宵節最有名的傳統就是「猜燈謎」。' },

  { q:'Round sticky rice balls in warm sweet soup are called ____.',
    zh:'圓圓的甜湯裡的小糯米球叫做 ____。',
    options:['Tangyuan','Dumpling','Couplet','Lantern'], answer:0,
    explain:'"Tangyuan" 湯圓——形狀圓圓，象徵團圓。' },

  { q:'Which adjective means "shining and full of light"?',
    zh:'哪一個形容詞代表「明亮、充滿光線」？',
    options:['Sweet','Joyful','Bright','Loud'], answer:2,
    explain:'"Bright" 明亮——形容燈籠最常用的單字。' },

  { q:'Which verb means "to find the answer to a puzzle"?',
    zh:'哪一個動詞是「想出謎語的答案」？',
    options:['Hang','Solve','Wrap','Greet'], answer:1,
    explain:'"Solve" 解開、想出答案——solve a riddle 猜燈謎。' },

  { q:'Which adjective means "feeling great happiness"?',
    zh:'哪一個形容詞是「非常喜悅的」？',
    options:['Sweet','Bright','Quiet','Joyful'], answer:3,
    explain:'"Joyful" 喜悅、歡欣——everyone looks joyful tonight。' },

  { q:'The Lantern Festival is on which day after Lunar New Year?',
    zh:'元宵節是農曆新年的第幾天？',
    options:['7th day','15th day','21st day','30th day'], answer:1,
    explain:'15th day——元宵節是農曆正月十五，春節結束。' },

  { q:'Why are tangyuan eaten on this night?',
    zh:'為什麼這一晚要吃湯圓？',
    options:['Because they cook quickly','Because they are spicy','Because their round shape symbolizes family togetherness','Because they are cold'], answer:2,
    explain:'圓圓的湯圓象徵「團圓」與家人緊密相連。' },

  { q:'What is hung from many lanterns at the festival?',
    zh:'元宵節時，燈籠上常掛著什麼？',
    options:['Money','Riddles','Photos','Flowers'], answer:1,
    explain:'燈謎——把謎語寫在紙條上掛在燈籠下，猜對得小禮物。' },

  { q:'The first ____ of the lunar year appears on Lantern Festival night.',
    zh:'元宵夜會出現新年的第一輪 ____。',
    options:['sunrise','full moon','snowfall','rainbow'], answer:1,
    explain:'Full moon 滿月——元宵是農曆正月第一次滿月之夜。' },

  { q:'Mia: "Wow, look at all these ____ lanterns!"',
    zh:'Roleplay 1：「哇，看看這些 ____ 的燈籠！」',
    options:['cold','quiet','bright','heavy'], answer:2,
    explain:'Scenario 1 用 bright——形容點亮的燈籠。' },

  { q:'Grandma: "Tangyuan are round and ____ — just like our family."',
    zh:'Roleplay 2：「湯圓圓圓的、____ 的——就像我們這家人。」',
    options:['sour','sweet','spicy','sticky'], answer:1,
    explain:'Scenario 2 用 sweet——強調家人團聚的甜美。' },

  { q:'Riddle Master: "I am bright at night but cannot be touched. What am I?"',
    zh:'Roleplay 3 燈謎：「我夜裡明亮，卻摸不到。我是什麼？」',
    options:['A star','A candle','A firework','A lantern'], answer:3,
    explain:'答案是 a lantern——can light up a whole room 是關鍵提示。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Your lantern shines the brightest tonight!'; msgZh='滿分！你的燈籠最閃亮！'; }
  else if(pct >= 80)   { emoji='🏮'; title='Excellent work!';  msgEn='Wonderful — you really understand the festival!'; msgZh='做得很好！你真的懂元宵節的精神。'; }
  else if(pct >= 60)   { emoji='🍡'; title='Good effort!';     msgEn='Nice try — review the riddles and tangyuan stories once more.'; msgZh='繼續加油！再回去看看燈謎和湯圓的故事。'; }
  else                 { emoji='🌕'; title='Keep practicing!'; msgEn="Don't give up — go back to the handout and try again!"; msgZh='不要放棄！回去再讀一次講義就會了。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
