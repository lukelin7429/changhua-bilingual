<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival 03 Quiz · Tomb-Sweeping Day · Festival English Series</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2a2725;--blue:#4a4239;--blue-soft:#ece5dc;--olive:#c9c920;--olive-soft:#f0f1c3;--olive-deep:#8c8e0a;--red:#e63d2e;--red-soft:#fde2dd;--sun:#f0a722;--sun-soft:#feeed0;--sun-deep:#a06c10;--green:#5b9d5b;--green-soft:#e7f3e7;--cream:#fbf7e8;--cream-warm:#fffcef;--line:#e3dfca;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(42,39,37,.30);--shadow-sm:0 6px 18px -6px rgba(42,39,37,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .head{background:var(--navy);color:#fff;border-radius:20px;padding:28px 28px;text-align:center;border-bottom:6px solid var(--olive);box-shadow:var(--shadow);}
  .head__brand{font-size:14.5px;letter-spacing:3px;color:var(--olive);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  @media (min-width:720px){ .head__brand{ font-size:16.5px; } }
  .head__title{font-family:'Playfair Display',serif;font-size:35px;font-weight:800;letter-spacing:.5px;line-height:1.1;}
  @media (min-width:720px){ .head__title{ font-size:48px; } }
  .head__sub{color:#d8d2c8;font-size:17.5px;margin-top:8px;font-style:italic;}
  @media (min-width:720px){ .head__sub{ font-size:21px; } }
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--olive);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--olive);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--navy);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--red);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--olive);color:var(--navy);box-shadow:0 6px 18px -6px rgba(201,201,32,.5);}
  .btn--primary:hover{background:var(--navy);color:#fff;}
  .btn--ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--olive);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
  .foot{text-align:center;font-size:14.5px;color:var(--ink-soft);font-style:italic;letter-spacing:.5px;margin-top:24px;}
  @media (min-width:720px){ .foot{ font-size:16.5px; } }
  .foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--olive);}
  .foot a:hover{color:var(--navy);}
</style>
<script defer src="/analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --carrot-deep:#B84A14;
    --carrot:#E66A2B;
    --carrot-soft:#fde6d3;
    --ocean-deep:#1F4D6B;
    --ocean:#3B7CA8;
    --ocean-soft:#d7e7f2;
    --leaf:#6BA346;
    --leaf-deep:#3f6f24;
    --leaf-soft:#e1f0d4;
    --sand:#f8efde;
    --sand-deep:#ecdcbe;
    --gold:#d9a23a;
    --gold-deep:#9d6e10;
    --gold-soft:#faecc8;
    --ink:#2a1e16;
    --ink-soft:#5d4c3e;
    --line:#ecdfd0;
    --shadow:0 14px 38px -16px rgba(184,74,20,.28);
    --shadow-sm:0 6px 16px -6px rgba(184,74,20,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:#fff;color:var(--ink);
    font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
    font-size:20px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  @media (min-width:720px){ body{ font-size:23px; } }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .serif{font-family:'Playfair Display','PingFang TC',serif;}

  section{padding:56px 0;border-bottom:1px solid var(--line);}
  @media (min-width:720px){ section{ padding:80px 0; } }
  section:last-of-type{border-bottom:none;}

  .sec__no{font-family:'Playfair Display',serif;color:var(--carrot);font-size:22px;font-weight:700;letter-spacing:5px;}
  @media (min-width:720px){ .sec__no{ font-size:25px; } }
  .sec__title{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;color:var(--carrot-deep);line-height:1.15;margin-top:6px;letter-spacing:.5px;}
  @media (min-width:720px){ .sec__title{ font-size:60px; } }
  .sec__title-zh{font-size:20px;color:var(--ink-soft);font-weight:500;margin-top:10px;letter-spacing:1px;}
  @media (min-width:720px){ .sec__title-zh{ font-size:24px; } }
  .sec__rule{width:96px;height:6px;background:var(--gold);border-radius:3px;margin:22px 0 36px;}

  /* === Sub-nav === */
  .subnav{
    background:var(--carrot-soft);padding:18px 0;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .subnav__inner{
    display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;align-items:center;
    font-family:'Playfair Display','PingFang TC',serif;font-size:19px;
  }
  @media (min-width:720px){ .subnav__inner{ font-size:21px; } }
  .subnav a{
    color:var(--carrot-deep);text-decoration:none;font-weight:600;
    padding:6px 12px;border-radius:20px;transition:all .15s;white-space:nowrap;
  }
  .subnav a:hover{background:#fff;color:var(--carrot);}
  .subnav a.is-active{background:var(--carrot);color:#fff;}
  .subnav__sep{color:var(--ink-soft);opacity:.4;}
  @media (max-width:600px){ .subnav__sep{display:none;} }

  /* === Hero Banner === */
  .banner{
    position:relative;
    background:url('photos/banner-court.jpg') center 50%/cover;
    background-color:var(--carrot-deep);
    min-height:300px;display:flex;align-items:flex-end;overflow:hidden;
  }
  @media (min-width:720px){ .banner{ min-height:420px; } }
  @media (min-width:1080px){ .banner{ min-height:480px; } }
  .banner__inner{
    position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;
    padding:32px 24px 28px;color:#fff;display:flex;align-items:flex-end;gap:18px;
  }
  @media (min-width:720px){ .banner__inner{ padding:48px 36px 40px;gap:24px; } }
  .banner__text{flex:1;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.78), 0 2px 14px rgba(0,0,0,.42);}
  .banner__brand{
    font-family:'Playfair Display',serif;
    font-size:13px;letter-spacing:4.5px;text-transform:uppercase;
    color:var(--gold-soft);font-weight:600;margin-bottom:12px;
  }
  @media (min-width:720px){ .banner__brand{ font-size:16px; } }
  .banner h1{
    font-family:'Playfair Display',serif;
    font-size:44px;font-weight:800;line-height:1.0;letter-spacing:.5px;
    text-shadow:0 2px 5px rgba(0,0,0,.55), 0 4px 22px rgba(0,0,0,.4);
  }
  @media (min-width:720px){ .banner h1{ font-size:74px; } }
  @media (min-width:1080px){ .banner h1{ font-size:92px; } }
  .banner__zh{
    font-size:20px;color:#fbeed8;margin-top:6px;font-weight:500;letter-spacing:1.5px;
    text-shadow:0 1px 3px rgba(0,0,0,.74), 0 2px 12px rgba(0,0,0,.5);
  }
  @media (min-width:720px){ .banner__zh{ font-size:28px; } }
  .banner__tagline{
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:17px;color:var(--sand);margin-top:14px;line-height:1.45;
    max-width:680px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.74), 0 2px 10px rgba(0,0,0,.45);
  }
  @media (min-width:720px){ .banner__tagline{ font-size:21px;margin-top:18px; } }
  .banner__badge{
    flex-shrink:0;align-self:flex-end;
    width:54px;height:54px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-size:30px;font-weight:800;color:var(--carrot-deep);
    box-shadow:0 8px 22px -6px rgba(0,0,0,.5);
  }
  @media (min-width:720px){ .banner__badge{ width:78px;height:78px;font-size:42px; } }

  /* === About === */
  .about__lead{
    font-family:'Playfair Display',serif;
    font-size:30px;font-weight:700;color:var(--carrot-deep);line-height:1.35;letter-spacing:.3px;
  }
  @media (min-width:720px){ .about__lead{ font-size:38px; } }
  .about__lead-zh{font-size:21px;color:var(--ink-soft);font-weight:500;margin-top:14px;line-height:1.55;}
  @media (min-width:720px){ .about__lead-zh{ font-size:25px; } }
  .about__body{margin-top:24px;font-size:20px;color:var(--ink);line-height:1.75;}
  @media (min-width:720px){ .about__body{ font-size:22px; } }
  .about__body p{margin-top:16px;}
  .about__body p:first-child{margin-top:0;}
  .about__body .zh{color:var(--ink-soft);font-size:19px;margin-top:8px;line-height:1.65;}
  @media (min-width:720px){ .about__body .zh{ font-size:21px; } }
  .about__body strong{color:var(--carrot-deep);font-weight:700;}

  .quote{
    margin-top:36px;background:var(--gold-soft);border-left:6px solid var(--gold);
    padding:24px 28px;border-radius:0 12px 12px 0;
  }
  .quote__text{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;color:var(--carrot-deep);line-height:1.4;font-style:italic;
  }
  @media (min-width:720px){ .quote__text{ font-size:32px; } }
  .quote__zh{font-size:19px;color:var(--ink-soft);margin-top:8px;line-height:1.55;}
  @media (min-width:720px){ .quote__zh{ font-size:20px; } }
  .quote--carrot{background:var(--carrot-soft);border-left-color:var(--carrot);}
  .quote--ocean{background:var(--ocean-soft);border-left-color:var(--ocean);}
  .quote--ocean .quote__text{color:var(--ocean-deep);}
  .quote--leaf{background:var(--leaf-soft);border-left-color:var(--leaf);}
  .quote--leaf .quote__text{color:var(--leaf-deep);}

  /* === Stat strip — stable facts only === */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:36px;}
  @media (min-width:720px){ .stats{ grid-template-columns:repeat(4,1fr);gap:18px; } }
  .stat{
    background:var(--sand);border:1px solid var(--line);border-radius:14px;
    padding:18px 14px;text-align:center;
  }
  .stat__num{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;color:var(--carrot);line-height:1.1;letter-spacing:.3px;}
  @media (min-width:720px){ .stat__num{ font-size:38px; } }
  .stat__num--small{font-size:22px;}
  @media (min-width:720px){ .stat__num--small{ font-size:28px; } }
  .stat__label{font-size:14px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;margin-top:6px;text-transform:uppercase;}
  @media (min-width:720px){ .stat__label{ font-size:16px; } }
  .stat__zh{font-size:14px;color:var(--ink-soft);margin-top:2px;font-weight:500;}
  @media (min-width:720px){ .stat__zh{ font-size:15px; } }

  /* === Heritage narrative + gallery === */
  .heritage{margin-top:44px;padding-top:36px;border-top:1px solid var(--line);}
  .heritage__title{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;color:var(--ocean-deep);line-height:1.2;}
  @media (min-width:720px){ .heritage__title{ font-size:34px; } }
  .heritage__title-zh{font-size:18px;color:var(--ink-soft);font-weight:600;margin-top:6px;letter-spacing:.5px;}
  @media (min-width:720px){ .heritage__title-zh{ font-size:21px; } }
  .heritage__body{margin-top:18px;font-size:19px;color:var(--ink);line-height:1.75;}
  @media (min-width:720px){ .heritage__body{ font-size:21px; } }
  .heritage__body p{margin-top:16px;}
  .heritage__body p:first-child{margin-top:0;}
  .heritage__body .zh{color:var(--ink-soft);font-size:18px;margin-top:8px;line-height:1.65;}
  @media (min-width:720px){ .heritage__body .zh{ font-size:20px; } }
  .heritage__body strong{color:var(--carrot-deep);font-weight:700;}

  .gallery{display:grid;grid-template-columns:1fr;gap:16px;margin-top:32px;}
  @media (min-width:720px){ .gallery{ grid-template-columns:repeat(3,1fr);gap:18px; } }
  .gallery figure{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);background:var(--sand);}
  .gallery img{width:100%;height:230px;object-fit:cover;display:block;}
  @media (min-width:720px){ .gallery img{ height:190px; } }
  .gallery figcaption{padding:14px 16px;font-size:15px;color:var(--ink-soft);line-height:1.5;}
  @media (min-width:720px){ .gallery figcaption{ font-size:16px; } }
  .gallery figcaption strong{display:block;color:var(--carrot-deep);font-weight:700;font-family:'Playfair Display',serif;font-size:18px;margin-bottom:3px;}
  @media (min-width:720px){ .gallery figcaption strong{ font-size:20px; } }

  /* === Four pillars === */
  .pillars{display:grid;grid-template-columns:1fr;gap:18px;}
  @media (min-width:720px){ .pillars{ grid-template-columns:1fr 1fr;gap:22px; } }
  .pillar{
    background:#fff;border-radius:18px;border:1px solid var(--line);
    padding:28px 26px;box-shadow:var(--shadow-sm);
    border-top:6px solid var(--carrot);transition:transform .2s, box-shadow .2s;
  }
  @media (min-width:720px){ .pillar{ padding:36px 32px; } }
  .pillar:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .pillar:nth-child(2){border-top-color:var(--ocean);}
  .pillar:nth-child(3){border-top-color:var(--leaf);}
  .pillar:nth-child(4){border-top-color:var(--gold);}
  .pillar__icon{font-size:46px;line-height:1;margin-bottom:12px;}
  @media (min-width:720px){ .pillar__icon{ font-size:56px; } }
  .pillar__title{
    font-family:'Playfair Display',serif;
    font-size:28px;font-weight:700;color:var(--carrot-deep);line-height:1.2;
    border-bottom:3px solid var(--gold);padding-bottom:6px;display:inline-block;
  }
  @media (min-width:720px){ .pillar__title{ font-size:34px; } }
  .pillar__title-zh{font-size:20px;color:var(--ink);font-weight:600;margin-top:8px;letter-spacing:1.5px;}
  @media (min-width:720px){ .pillar__title-zh{ font-size:23px; } }
  .pillar__body{font-size:18px;color:var(--ink-soft);margin-top:14px;line-height:1.65;}
  @media (min-width:720px){ .pillar__body{ font-size:20px; } }
  .pillar__body strong{color:var(--ink);font-weight:700;}

  /* === Spotlight (Small School, National Stage) === */
  .spotlight{
    background:linear-gradient(135deg, var(--carrot-soft) 0%, var(--gold-soft) 60%, var(--ocean-soft) 100%);
    border-radius:24px;padding:36px 28px;border:2px solid var(--carrot);box-shadow:var(--shadow);
  }
  @media (min-width:720px){ .spotlight{ padding:56px 48px; } }
  .spotlight__badge{
    display:inline-block;background:var(--carrot);color:#fff;
    font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    padding:6px 14px;border-radius:99px;
  }
  @media (min-width:720px){ .spotlight__badge{ font-size:16px; } }
  .spotlight__title{
    font-family:'Playfair Display',serif;
    font-size:34px;font-weight:800;color:var(--carrot-deep);line-height:1.15;
    margin-top:14px;letter-spacing:.5px;
  }
  @media (min-width:720px){ .spotlight__title{ font-size:50px; } }
  .spotlight__zh{font-size:21px;color:var(--ink-soft);font-weight:600;margin-top:8px;}
  @media (min-width:720px){ .spotlight__zh{ font-size:25px; } }

<script>
const QUIZ = [
  { q:'Which word means "a family member who lived a long time ago"?',
    zh:'哪一個單字代表「很久以前的家族成員」？',
    options:['Picnic','Ancestor','Kite','Tomb'], answer:1,
    explain:'"Ancestor" 祖先——my great-grandfather is one of our ancestors。' },

  { q:'"Three sticks of ____ are held gently to honor the ancestors."',
    zh:'「我們手持三炷 ____，敬拜祖先。」',
    options:['kites','tea','incense','flowers'], answer:2,
    explain:'"Incense" 線香——三炷香是清明祭祖最常見的動作。' },

  { q:'Which adjective means "feeling thanks for what someone has done"?',
    zh:'哪一個形容詞是「感恩的」？',
    options:['Peaceful','Grateful','Solemn','Quiet'], answer:1,
    explain:'"Grateful" 感恩——對祖先給予的一切心懷感激。' },

  { q:'Which verb means "to show deep respect for someone"?',
    zh:'哪一個動詞代表「對某人致以最高敬意」？',
    options:['Sweep','Honor','Hide','Race'], answer:1,
    explain:'"Honor" 敬重——we honor our ancestors today。' },

  { q:'Where did Jie Zitui go to live with his old mother?',
    zh:'介子推帶著母親去哪裡隱居？',
    options:['Beside a river','In a busy market','In the mountains','Under the sea'], answer:2,
    explain:'介子推帶母親隱居山中，後來文公放火燒山。' },

  { q:'Why did the king order people to eat only cold food on that day?',
    zh:'晉文公為什麼下令這一天只能吃冷食？',
    options:['Because firewood was expensive','To remember Jie Zitui and his mother','Because cold food is healthier','To save time'], answer:1,
    explain:'紀念介子推母子——文公燒山逼他出來不成，悲痛之餘下令禁火。' },

  { q:'What do families usually leave on the family tomb?',
    zh:'家人通常會在墓上擺什麼？',
    options:['Phones and keys','Fruit, sweet cakes, and tea','Books','Toys'], answer:1,
    explain:'供品：新鮮水果、甜糕點、一杯熱茶——簡單而誠心。' },

  { q:'Why do families fly kites in the afternoon of this festival?',
    zh:'清明下午為什麼放風箏？',
    options:['Because the wind is strongest','To enjoy the spring and let go of bad luck','To compete with neighbors','Because school says so'], answer:1,
    explain:'踏青放風箏——一邊享受春天，一邊象徵讓壞運氣飛走。' },

  { q:'The day before Tomb-Sweeping Day is called ____ Day.',
    zh:'清明節的前一天叫 ____ 日。',
    options:['Hot Food','Cold Food','New Food','Fast Food'], answer:1,
    explain:'寒食日 Cold Food Day——延續介子推故事的禁火傳統。' },

  { q:'Grandma: "Then we ____ three times and say a quiet hello."',
    zh:'Roleplay 1：「然後我們 ____ 三次，向爺爺輕聲問安。」',
    options:['jump','bow','run','sing'], answer:1,
    explain:'Scenario 1 用 bow——鞠躬三次是傳統的致敬方式。' },

  { q:'Child: "I want to ____ her every Tomb-Sweeping Day."',
    zh:'Roleplay 2：「每年清明節，我都想 ____ 她。」',
    options:['forget','remember','sell','copy'], answer:1,
    explain:'Scenario 2 用 remember——紀念是清明節最重要的精神。' },

  { q:'Dad: "In the old days, people believed kites carried away ____."',
    zh:'Roleplay 3：「從前的人相信風箏會帶走 ____。」',
    options:['homework','bad luck','rain','sunshine'], answer:1,
    explain:'Scenario 3 用 bad luck——放風箏的傳統意義是把壞運氣放走。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Your ancestors would be proud of you.'; msgZh='滿分！祖先一定也以你為榮。'; }
  else if(pct >= 80)   { emoji='🌿'; title='Excellent work!';  msgEn='Wonderful — a thoughtful student remembers well.'; msgZh='做得很好！有心的學生最會紀念。'; }
  else if(pct >= 60)   { emoji='🕯️'; title='Good effort!';    msgEn='Nice try — review the story of Jie Zitui once more.'; msgZh='繼續加油！再讀一次介子推的故事。'; }
  else                 { emoji='🪁'; title='Keep practicing!'; msgEn="Don't give up — go back to the handout and try again!"; msgZh='不要放棄！回去再讀一次講義就會了。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>

</body>
</html>
