<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://changhua-bilingual.org/schools/yangming-jhs/lessons/">
<title>Lessons · Yangming Junior High School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0c2e6b;--blue:#1a4791;--olive:#c9c920;--olive-soft:#f0f1c3;--red:#e63d2e;--sun:#f0a722;--ink:#1f2530;--ink-soft:#5a606e;--line:#e3dfca;--shadow:0 14px 38px -16px rgba(12,46,107,.28);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--ink);font-family:'Inter','PingFang TC',sans-serif;font-size:20px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px;}

  .head{background:var(--navy);color:#fff;padding:48px 24px 52px;text-align:center;border-bottom:6px solid var(--olive);}
  .head__eyebrow{font-size:13px;letter-spacing:4px;color:var(--olive);font-weight:700;text-transform:uppercase;margin-bottom:14px;}
  .head__title{font-family:'Playfair Display',serif;font-size:clamp(36px,6vw,64px);font-weight:800;line-height:1.1;}
  .head__zh{font-size:20px;color:#cdd4ee;font-weight:600;margin-top:10px;letter-spacing:1px;}

  .programs{padding:56px 0 80px;display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:640px){.programs{grid-template-columns:1fr 1fr;}}

  .prog{
    background:#fff;border-radius:20px;border:1px solid var(--line);
    padding:36px 32px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
    border-top:8px solid var(--blue);
    transition:transform .18s,box-shadow .18s;display:block;
  }
  .prog:hover{transform:translateY(-4px);box-shadow:0 20px 48px -16px rgba(12,46,107,.38);}
  .prog__icon{font-size:52px;line-height:1;margin-bottom:16px;}
  .prog__teacher{font-size:13px;letter-spacing:3px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:6px;}
  .prog__title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--navy);line-height:1.2;}
  .prog__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  .prog__count{display:inline-block;margin-top:16px;background:var(--olive-soft);color:var(--navy);font-size:14px;font-weight:700;padding:5px 14px;border-radius:99px;}
  .prog__arrow{float:right;font-size:28px;color:var(--olive);margin-top:-4px;}

  /* future slot */
  .prog--coming{border-top-color:var(--line);opacity:.55;pointer-events:none;}
  .prog--coming .prog__count{background:var(--line);color:var(--ink-soft);}
</style>
<link rel="stylesheet" href="/assets/css/motion.css?v=6b07c240">
</head>
<body>

<div class="head">
  <div class="wrap">
    <div class="head__eyebrow">Yangming Junior High School · 陽明國中</div>
    <h1 class="head__title">Lessons</h1>
    <div class="head__zh">課程入口 · 各合作老師的教學資源</div>
  </div>
</div>

<main class="wrap">
  <div class="programs">

    <a class="prog" href="shannon/">
      <div class="prog__icon">🌏</div>
      <div class="prog__teacher">Teacher Shannon</div>
      <h2 class="prog__title">Diplomatic Pioneers ESL</h2>
      <div class="prog__zh">外交小尖兵 · 英語工作坊</div>
      <div class="prog__count">12 lessons &amp; quizzes</div>
      <span class="prog__arrow">→</span>
    </a>

  </div>
</main>

<footer style="text-align:center;padding:32px 24px;font-size:15px;color:var(--ink-soft);border-top:1px solid var(--line);">
  Yangming Junior High School · Lessons Portal &nbsp;·&nbsp;
  Supported by <a href="https://www.mycultureconnect.org/" target="_blank" rel="noopener" style="color:var(--blue);">My Culture Connect 人師教育協會</a>
</footer>

<script defer src="/assets/js/motion.js?v=b0540bb5"></script>
</body>
</html>
