<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="canonical" href="https://changhua-bilingual.org/schools/taihe/lessons/campus-life/shuttlecock/quiz/">
<title>Quiz · Shuttlecock Kicking · Campus Life · Tai-He Elementary School</title>
<meta name="description" content="A 5-question quiz on shuttlecock kicking vocabulary — kick, foot, catch, take turns. 踢毽子單字小考，5 題選擇題。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green-deep:#2f7d32;--green:#5a9d52;--green-soft:#e7f3e7;--gold:#d89a3c;--gold-deep:#9c6e1c;--red:#c4334a;--red-soft:#fbe0e3;--blue-deep:#1f3a6e;--cream:#fdfaf2;--cream-warm:#fffcef;--line:#e6e0d2;--ink:#1f2530;--ink-soft:#5a606e;--shadow:0 16px 40px -16px rgba(31,58,46,.30);--shadow-sm:0 6px 18px -6px rgba(31,58,46,.20);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:22px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  @media (min-width:720px){ html,body{ font-size:25.5px; } }
  .quiz-wrap{max-width:840px;margin:0 auto;padding:32px 22px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px;margin-top:26px;flex:1;display:flex;flex-direction:column;}
  @media (min-width:720px){ .card{ padding:48px 44px; } }
  .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .progress__no{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--green-deep);letter-spacing:1.5px;}
  @media (min-width:720px){ .progress__no{ font-size:24px; } }
  .progress__bar{flex:1;margin-left:18px;height:8px;background:var(--cream);border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  @media (min-width:720px){ .progress__bar{ height:10px; } }
  .progress__fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s ease;width:0%;}
  .question{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--blue-deep);line-height:1.4;margin-top:8px;letter-spacing:.2px;}
  @media (min-width:720px){ .question{ font-size:36px; } }
  .question__zh{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  @media (min-width:720px){ .question__zh{ font-size:22px; } }
  .options{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  .opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:21px;font-family:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:16px;line-height:1.4;}
  @media (min-width:720px){ .opt{ font-size:25px;padding:22px 24px; } }
  .opt:hover:not(:disabled){border-color:var(--green);background:var(--cream-warm);transform:translateX(2px);}
  .opt__mark{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--green-deep);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:18px;border:2px solid var(--line);font-family:'Playfair Display',serif;}
  @media (min-width:720px){ .opt__mark{ width:48px;height:48px;font-size:21px; } }
  .opt.is-correct{background:var(--green-soft);border-color:var(--green);color:#2c6b2c;}
  .opt.is-correct .opt__mark{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.is-wrong{background:var(--red-soft);border-color:var(--red);color:#8b2e22;}
  .opt.is-wrong .opt__mark{background:var(--red);color:#fff;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:22px;padding:14px 18px;border-radius:12px;font-size:18px;font-weight:600;text-align:center;line-height:1.5;min-height:0;opacity:0;transition:opacity .2s;}
  @media (min-width:720px){ .feedback{ font-size:21px; } }
  .feedback.show{opacity:1;}
  .feedback--ok{background:var(--green-soft);color:#2c6b2c;border:1.5px solid var(--green);}
  .feedback--ng{background:var(--red-soft);color:#8b2e22;border:1.5px solid var(--red);}
  .result{text-align:center;}
  .result__emoji{font-size:72px;line-height:1;}
  @media (min-width:720px){ .result__emoji{ font-size:96px; } }
  .result__title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--blue-deep);margin-top:14px;letter-spacing:.5px;}
  @media (min-width:720px){ .result__title{ font-size:50px; } }
  .result__score{font-family:'Playfair Display',serif;font-size:68px;font-weight:800;color:var(--green-deep);margin:18px 0 6px;line-height:1;}
  @media (min-width:720px){ .result__score{ font-size:92px; } }
  .result__score small{font-size:30px;color:var(--ink-soft);font-weight:600;font-family:inherit;}
  @media (min-width:720px){ .result__score small{ font-size:38px; } }
  .result__msg{font-size:22px;color:var(--ink);line-height:1.6;margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto;}
  @media (min-width:720px){ .result__msg{ font-size:26px; } }
  .result__zh{font-size:17px;color:var(--ink-soft);margin-top:6px;}
  @media (min-width:720px){ .result__zh{ font-size:19px; } }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:18px 32px;font-size:21px;font-weight:700;font-family:inherit;letter-spacing:.5px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;}
  @media (min-width:720px){ .btn{ font-size:24px;padding:20px 36px; } }
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--green);color:#fff;box-shadow:0 6px 18px -6px rgba(90,157,82,.6);}
  .btn--primary:hover{background:var(--green-deep);color:#fff;}
  .btn--ghost{background:#fff;color:var(--green-deep);border:2px solid var(--line);}
  .btn--ghost:hover{background:var(--cream-warm);border-color:var(--green);}
  .result__actions{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:center;}
  @media (min-width:720px){ .result__actions{ flex-direction:row;justify-content:center;gap:16px; } }
  .result__actions .btn{min-width:240px;}
</style>
<script defer src="/analytics.js"></script>

<style>
/* Campus Life quiz hero — sits below school's native topbar */
.th-cl-hero{position:relative;color:#fff;overflow:hidden;min-height:230px;padding:36px 0 32px;display:flex;align-items:center;background:linear-gradient(135deg,#5a9d52 0%,#2f7d32 100%);}
@media (min-width:720px){ .th-cl-hero{min-height:300px;padding:52px 0 44px;} }
.th-cl-hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#2f7d32 0%,#5a9d52 50%,#d89a3c 100%);pointer-events:none;z-index:2;}
.th-cl-hero__inner{max-width:1080px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;position:relative;z-index:1;}
@media (max-width:680px){ .th-cl-hero__inner{grid-template-columns:1fr;gap:16px;} }
.th-cl-hero__emoji{font-size:84px;line-height:1;text-align:center;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.30));}
@media (min-width:720px){ .th-cl-hero__emoji{font-size:118px;} }
.th-cl-hero__eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.32em;color:#fbe9c8;font-weight:700;text-transform:uppercase;margin-bottom:14px;padding:5px 14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);border-radius:99px;}
.th-cl-hero h1{font-family:'Playfair Display','PingFang TC',serif;font-size:clamp(30px,4.6vw,48px);font-weight:700;color:#fff;line-height:1.05;text-shadow:0 2px 6px rgba(0,0,0,.40);}
.th-cl-hero__zh{font-size:clamp(15px,1.9vw,20px);font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.94);margin-top:8px;font-family:'PingFang TC',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.40);}
.th-cl-hero__crumb{margin-top:14px;font-size:13.5px;color:rgba(255,255,255,.82);font-family:'PingFang TC',sans-serif;}
.th-cl-hero__crumb a{color:#fbe9c8;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.40);}
.th-cl-hero__crumb a:hover{color:#fff;}
</style>

<body>
<div class="topbar">
  <div class="topbar__inner">
    <a class="topbar__brand" href="/schools/taihe/">
      <img class="topbar__logo" src="/schools/taihe/photos/logo.png" alt="Tai-He Elementary School logo">
      <div class="topbar__name">Tai-He Elementary<small>彰化縣彰化市泰和國民小學</small></div>
    </a>
    <nav class="topbar__nav">
      <a href="/schools/taihe/">Home</a>
      <a href="/schools/taihe/principal/">Principal</a>
      <a href="/schools/taihe/lessons/" class="is-active">Lessons</a>
      <a href="/schools/taihe/news/">News</a>
      <a href="/schools/taihe/festivals/">Festivals</a>
    </nav>
  </div>
</div>

<header class="th-cl-hero">
  <div class="th-cl-hero__inner">
    <div class="th-cl-hero__emoji">🪶</div>
    <div>
      <span class="th-cl-hero__eyebrow">Quiz · 小考</span>
      <h1>Quiz · Shuttlecock Kicking</h1>
      <div class="th-cl-hero__zh">踢毽子 小考 · 5 題</div>
      <div class="th-cl-hero__crumb">
        <a href="../">← Back to lesson · 回課程</a>
        &nbsp;&middot;&nbsp; Campus Life · 校園生活
      </div>
    </div>
  </div>
</header>

<div class="quiz-wrap">
  <main class="card" id="quiz-card">
    <div class="progress">
      <div class="progress__no" id="qno">Question 1 / 5</div>
      <div class="progress__bar"><div class="progress__fill" id="bar"></div></div>
    </div>
    <div class="question" id="question">Loading…</div>
    <div class="question__zh" id="question-zh"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </main>

  <main class="card result" id="result-card" style="display:none;">
    <div class="result__emoji" id="r-emoji">🪶</div>
    <div class="result__title" id="r-title">Well done!</div>
    <div class="result__score">
      <span id="r-score">0</span> / <span id="r-total">5</span>
      <small id="r-pct">(0%)</small>
    </div>
    <p class="result__msg" id="r-msg-en">You did great!</p>
    <p class="result__zh" id="r-msg-zh">完成了！</p>
    <div class="result__actions">
      <button class="btn btn--primary" id="btn-restart">Try again · 再試一次</button>
      <a class="btn btn--ghost" href="../">← Back to lesson · 回課程</a>
    </div>
  </main>

</div>

<script>
const QUIZ = [
  { q:'Which word means the feathered object you kick up in the air?',
    zh:'哪一個單字是「毽子」（你往空中踢的羽毛玩具）？',
    options:['Shuttlecock','Basket','Rope','Drum'], answer:0,
    explain:'"Shuttlecock" 毽子——就是影片裡小朋友踢的那個。' },

  { q:'Which verb means to hit something with your foot?',
    zh:'哪一個動詞是「踢」？',
    options:['Throw','Kick','Catch','Count'], answer:1,
    explain:'"Kick" 踢——kick the shuttlecock up。' },

  { q:'You kick the shuttlecock with your ____.',
    zh:'你用你的 ____ 踢毽子。',
    options:['hand','head','foot','ear'], answer:2,
    explain:'"foot" 腳——用腳的內側踢最穩。' },

  { q:'What does "take turns" mean?',
    zh:'「take turns」是什麼意思？',
    options:['Play alone','One after another','Stop playing','Run away'], answer:1,
    explain:'"Take turns" 輪流——一個人玩完換下一個。' },

  { q:'Your friend throws the shuttlecock to you. What do you do?',
    zh:'朋友把毽子拋給你，你要做什麼？',
    options:['Throw it back without looking','Catch it','Hide it','Sit down'], answer:1,
    explain:'"Catch" 接住——catch it with your hands。' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const state = { idx:0, score:0, answers:[] };

function render(){
  const q = QUIZ[state.idx];
  $('#qno').textContent = `Question ${state.idx + 1} / ${QUIZ.length}`;
  $('#bar').style.width = (state.idx / QUIZ.length * 100) + '%';
  $('#question').textContent = q.q;
  $('#question-zh').textContent = q.zh;
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt__mark">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i, btn));
    box.appendChild(btn);
  });
  $('#question').scrollIntoView({behavior:'smooth', block:'start'});
}

function answer(picked, btn){
  const q = QUIZ[state.idx];
  const ok = picked === q.answer;
  state.answers.push({ q: state.idx, picked, correct: ok });
  if(ok) state.score++;
  $$('#options .opt').forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add('is-correct');
    if(i === picked && !ok) b.classList.add('is-wrong');
  });
  const fb = $('#feedback');
  fb.classList.add('show');
  fb.classList.add(ok ? 'feedback--ok' : 'feedback--ng');
  fb.innerHTML = ok
    ? `✓ Correct! 答對了！<br><span style="font-weight:500;">${q.explain}</span>`
    : `✗ The answer is: <b>${q.options[q.answer]}</b><br><span style="font-weight:500;">${q.explain}</span>`;
  $('#bar').style.width = ((state.idx + 1) / QUIZ.length * 100) + '%';
  setTimeout(() => {
    state.idx++;
    if(state.idx >= QUIZ.length) finish();
    else render();
  }, 2200);
}

function finish(){
  const total = QUIZ.length, score = state.score, pct = Math.round(score / total * 100);
  $('#r-score').textContent = score;
  $('#r-total').textContent = total;
  $('#r-pct').textContent = `(${pct}%)`;
  let emoji, title, msgEn, msgZh;
  if(pct === 100)      { emoji='🏆'; title='Perfect score!';   msgEn='Ten kicks in a row — a perfect game!'; msgZh='滿分！像連踢十下一樣厲害！'; }
  else if(pct >= 80)   { emoji='🪶'; title='Excellent work!';  msgEn='Great kicking — well done!'; msgZh='踢得很好！做得很棒。'; }
  else if(pct >= 60)   { emoji='🦶'; title='Good effort!';     msgEn='Nice try — watch the video and try again.'; msgZh='不錯！再看一次影片就更熟了。'; }
  else                 { emoji='🌱'; title='Keep practicing!'; msgEn="Don't give up — go back and learn the words!"; msgZh='別放棄！回去再學一次單字就會了。'; }
  $('#r-emoji').textContent = emoji;
  $('#r-title').textContent = title;
  $('#r-msg-en').textContent = msgEn;
  $('#r-msg-zh').textContent = msgZh;
  $('#quiz-card').style.display = 'none';
  $('#result-card').style.display = 'flex';
  $('#result-card').style.flexDirection = 'column';
  $('#result-card').style.alignItems = 'center';
  $('#result-card').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#btn-restart').addEventListener('click', () => {
  state.idx = 0; state.score = 0; state.answers = [];
  $('#result-card').style.display = 'none';
  $('#quiz-card').style.display = 'flex';
  render();
});

render();
</script>
</body>
</html>
