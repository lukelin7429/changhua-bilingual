<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>發音校對台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --ground:#f6f7f5; --surface:#fff; --ink:#1a2422; --muted:#6b7874;
  --teal:#1f6e6e; --teal-soft:#e8f0ee; --flag:#a8482c; --flag-soft:#fbeee9;
  --line:#e2e6e2; --done:#3d7a5c;
  --zh:'PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;
  --en:'Inter',system-ui,sans-serif;
  --display:'Playfair Display',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --surface:#1a201e; --ink:#e8ece9; --muted:#8fa099;
    --teal:#5aacaa; --teal-soft:#1d2e2c; --flag:#dc8563; --flag-soft:#2e211c;
    --line:#2a322f; --done:#6fae8b;
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --surface:#1a201e; --ink:#e8ece9; --muted:#8fa099;
  --teal:#5aacaa; --teal-soft:#1d2e2c; --flag:#dc8563; --flag-soft:#2e211c;
  --line:#2a322f; --done:#6fae8b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--en);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-block:28px 80px;padding-left:18px;padding-right:18px}

header h1{font-family:var(--display);font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:15px;max-width:52ch}
header p .zh{font-family:var(--zh)}

.bar{position:sticky;top:0;z-index:5;background:var(--ground);
  padding-block:14px;margin-top:22px;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--muted)}
select{font-family:var(--en);font-size:15px;padding:8px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
select:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.tally{margin-left:auto;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:600}
.tally .bad{color:var(--flag)}

h2{font-family:var(--en);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;color:var(--teal);margin:30px 0 2px}
h2 span{font-family:var(--zh);letter-spacing:0;text-transform:none;color:var(--muted);
  font-weight:500;font-size:13px;margin-left:8px}

ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:13px 4px 13px 12px;border-bottom:1px solid var(--line);
  border-left:3px solid transparent}
li.flagged{border-left-color:var(--flag);background:var(--flag-soft)}
li.heard .zh{color:var(--muted)}

.play{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--teal);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:background .12s,border-color .12s}
.play:hover{border-color:var(--teal);background:var(--teal-soft)}
.play:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.play.playing{background:var(--teal);border-color:var(--teal);color:#fff}

.txt{min-width:0}
.zh{font-family:var(--zh);font-size:23px;font-weight:600;line-height:1.25;
  overflow-wrap:anywhere}
.meta{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-top:3px}
.py{font-size:14px;color:var(--muted);font-style:italic}
.tones{display:flex;gap:3px}
.tone{font-size:10px;font-weight:700;width:15px;height:15px;border-radius:3px;
  display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);
  font-variant-numeric:tabular-nums}
.tone[data-t="5"]{opacity:.55}
.qid{font-size:11px;color:var(--muted);letter-spacing:.04em}

.mark{flex:none;font-family:var(--zh);font-size:13px;font-weight:600;
  padding:7px 12px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.mark:hover{border-color:var(--flag);color:var(--flag)}
.mark:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
li.flagged .mark{background:var(--flag);border-color:var(--flag);color:#fff}

.err{position:sticky;top:62px;z-index:4;margin:12px 0 0;padding:10px 13px;
  border-radius:8px;background:var(--flag-soft);color:var(--flag);
  border:1px solid var(--flag);font-family:var(--zh);font-size:14px}
.report{margin-top:34px;padding:20px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line)}
.report h3{margin:0 0 4px;font-size:16px;font-family:var(--zh)}
.report p{margin:0 0 14px;font-size:14px;color:var(--muted);font-family:var(--zh)}
textarea{width:100%;min-height:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px;line-height:1.65;padding:12px;border-radius:8px;resize:vertical;
  border:1px solid var(--line);background:var(--ground);color:var(--ink)}
textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button.act{font-family:var(--zh);font-size:14px;font-weight:600;padding:10px 16px;
  border-radius:8px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);cursor:pointer}
button.act.primary{background:var(--teal);border-color:var(--teal);color:#fff}
button.act:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.clean{color:var(--done);font-family:var(--zh);font-size:15px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>發音校對台</h1>
  <p><span class="zh">一次校對一場會議的語音。點圓鈕聽，唸錯就按「唸錯」，最後把清單複製給我。進度會自動留著，關掉再回來不會不見。</span></p>
</header>

<div class="bar">
  <label for="round">場次</label>
  <select id="round"></select>
  <span class="tally" id="tally"></span>
</div>

<p id="err" class="err" hidden role="status"></p>
<div id="list"></div>

<section class="report" id="report">
  <h3>校對結果</h3>
  <p id="reportNote">還沒標記任何一個。</p>
  <textarea id="out" readonly aria-label="校對結果清單"></textarea>
  <div class="acts">
    <button class="act primary" id="copy" type="button">複製清單</button>
    <button class="act" id="reset" type="button">清除本場次標記</button>
  </div>
</section>
</div>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var BASE = '/learn/audio/';
  var LEVELS = [['beginner','入門 Beginner'],['intermediate','進階 Intermediate'],['advanced','高階 Advanced']];
  var MONTHS = ['September 2026','October 2026','November 2026','December 2026',
                'January 2027','March 2027','April 2027','May 2027','June 2027'];
  var KEY = 'chb-audio-proof-v1';

  var state = load();
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  // Tone numbers from the pinyin's own diacritics — what you are listening for.
  var MARKS = {
    '\u0101':1,'\u00e1':2,'\u01ce':3,'\u00e0':4,
    '\u014d':1,'\u00f3':2,'\u01d2':3,'\u00f2':4,
    '\u0113':1,'\u00e9':2,'\u011b':3,'\u00e8':4,
    '\u012b':1,'\u00ed':2,'\u01d0':3,'\u00ec':4,
    '\u016b':1,'\u00fa':2,'\u01d4':3,'\u00f9':4,
    '\u01d6':1,'\u01d8':2,'\u01da':3,'\u01dc':4
  };
  function tones(py){
    return String(py||'').split(/[\s\u00b7]+/).filter(Boolean).map(function(syl){
      for (var i=0;i<syl.length;i++){ if (MARKS[syl[i]]) return MARKS[syl[i]]; }
      return 5;
    });
  }

  var roundSel = document.getElementById('round');
  MONTHS.forEach(function(m,i){
    var o=document.createElement('option');
    o.value='M'+(i+1); o.textContent='M'+(i+1)+' · '+m;
    roundSel.appendChild(o);
  });

  var audio = new Audio(), playingBtn = null;
  audio.addEventListener('ended', function(){ if(playingBtn) playingBtn.classList.remove('playing'); playingBtn=null; });
  function play(hash, btn){
    if (playingBtn) playingBtn.classList.remove('playing');
    audio.src = BASE + hash + '.mp3';
    btn.classList.add('playing'); playingBtn = btn;
    audio.play().catch(function(err){
      btn.classList.remove('playing'); playingBtn = null;
      note('播不出來：' + (err && err.name ? err.name : '未知錯誤') +
           '。檔案 ' + hash + '.mp3');
    });
  }
  audio.addEventListener('error', function(){
    if (playingBtn) { playingBtn.classList.remove('playing'); playingBtn = null; }
    note('這個音檔載入失敗，可能還沒上傳到 R2。');
  });
  function note(msg){
    var el = document.getElementById('err');
    el.textContent = msg; el.hidden = false;
    clearTimeout(note._t); note._t = setTimeout(function(){ el.hidden = true; }, 5000);
  }

  function flagKey(round, level, id){ return round+'|'+level+'|'+id; }

  function render(){
    var round = roundSel.value;
    var list = document.getElementById('list');
    list.innerHTML = '';
    var total = 0, flagged = 0, heard = 0;

    LEVELS.forEach(function(pair){
      var level = pair[0], rows = (DATA[round]||{})[level] || [];
      if (!rows.length) return;
      var h2 = document.createElement('h2');
      h2.textContent = pair[1].split(' ')[1] || pair[1];
      var zh = document.createElement('span'); zh.textContent = pair[1].split(' ')[0];
      h2.textContent = (pair[1].split(' ')[1]||''); h2.appendChild(zh);
      list.appendChild(h2);

      var ol = document.createElement('ol');
      rows.forEach(function(r){
        total++;
        var k = flagKey(round, level, r.id);
        var st = state[k] || {};
        if (st.flag) flagged++;
        if (st.heard) heard++;

        var li = document.createElement('li');
        li.className = (st.flag?'flagged ':'') + (st.heard?'heard':'');

        var btn = document.createElement('button');
        btn.className='play'; btn.type='button';
        btn.setAttribute('aria-label','播放 '+r.zh);
        btn.textContent='▶';
        btn.addEventListener('click', function(){
          play(r.h, btn);
          state[k] = Object.assign({}, state[k], {heard:true});
          save(); li.classList.add('heard'); updateTally();
        });

        var txt = document.createElement('div'); txt.className='txt';
        var z = document.createElement('div'); z.className='zh'; z.textContent = r.zh;
        var meta = document.createElement('div'); meta.className='meta';
        var py = document.createElement('span'); py.className='py'; py.textContent = r.py;
        var tw = document.createElement('span'); tw.className='tones';
        tones(r.py).forEach(function(t){
          var s=document.createElement('span'); s.className='tone'; s.dataset.t=t;
          s.textContent = t===5?'\u00b7':t; s.title='第'+t+'聲';
          tw.appendChild(s);
        });
        var qid = document.createElement('span'); qid.className='qid'; qid.textContent = r.id;
        meta.appendChild(py); meta.appendChild(tw); meta.appendChild(qid);
        txt.appendChild(z); txt.appendChild(meta);

        var mark = document.createElement('button');
        mark.className='mark'; mark.type='button'; mark.textContent='唸錯';
        mark.setAttribute('aria-pressed', st.flag?'true':'false');
        mark.addEventListener('click', function(){
          var now = !(state[k]&&state[k].flag);
          state[k] = Object.assign({}, state[k], {flag:now});
          save();
          li.classList.toggle('flagged', now);
          mark.setAttribute('aria-pressed', now?'true':'false');
          updateTally();
        });

        li.appendChild(btn); li.appendChild(txt); li.appendChild(mark);
        ol.appendChild(li);
      });
      list.appendChild(ol);
    });

    updateTally();
  }

  function updateTally(){
    var round = roundSel.value, total=0, flagged=0, heard=0, bad=[];
    LEVELS.forEach(function(pair){
      var level=pair[0];
      ((DATA[round]||{})[level]||[]).forEach(function(r){
        total++;
        var st = state[flagKey(round,level,r.id)] || {};
        if (st.heard) heard++;
        if (st.flag){ flagged++; bad.push({level:level, r:r}); }
      });
    });
    document.getElementById('tally').innerHTML =
      '聽過 <b>'+heard+'</b>/'+total+(flagged?' · <b class="bad">'+flagged+' 唸錯</b>':'');

    var note = document.getElementById('reportNote');
    var out = document.getElementById('out');
    if (!bad.length){
      note.textContent = heard ? '' : '還沒標記任何一個。';
      note.innerHTML = heard===total && total>0
        ? '<span class="clean">這一場全部聽過，沒有發現問題。</span>'
        : (heard ? '目前沒有標記唸錯的。' : '還沒標記任何一個。');
      out.value = '';
    } else {
      note.textContent = '把下面這段複製給 Claude，我會逐一修正。';
      var lines = [round + ' 發音校對 — ' + bad.length + ' 個唸錯'];
      var byLevel = {};
      bad.forEach(function(b){ (byLevel[b.level] = byLevel[b.level] || []).push(b.r); });
      LEVELS.forEach(function(p){
        var rows = byLevel[p[0]]; if (!rows) return;
        lines.push('', '[' + p[0] + ']');
        rows.forEach(function(r){ lines.push('  ' + r.id + '  ' + r.zh + '  ' + r.py); });
      });
      out.value = lines.join('\n');
    }
  }

  document.getElementById('copy').addEventListener('click', function(){
    var out = document.getElementById('out');
    if (!out.value) return;
    out.select();
    navigator.clipboard.writeText(out.value).then(function(){
      var b=document.getElementById('copy'); var t=b.textContent;
      b.textContent='已複製'; setTimeout(function(){ b.textContent=t; }, 1400);
    }).catch(function(){ document.execCommand('copy'); });
  });

  document.getElementById('reset').addEventListener('click', function(){
    var round = roundSel.value;
    Object.keys(state).forEach(function(k){ if (k.indexOf(round+'|')===0) delete state[k]; });
    save(); render();
  });

  roundSel.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
