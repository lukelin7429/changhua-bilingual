<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>口譯練習室 · Interpreting Lab</title>
<meta name="description" content="外師業務中英口譯練習：情境口譯、行政詞彙、中式英文診斷、外師口語、訊息改寫、文化解說。">
<meta name="theme-color" content="#0c2e6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="口譯練習室">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/logo/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-deep:#0c2e6b; --blue:#1a4791; --blue-soft:#dbe3f0;
  --sun:#f0a722; --cream:#fbf7e8;
  --ink:#1f2530; --ink-soft:#5a606e; --line:#e6e2d3;
  --ok:#15803d; --ok-soft:#dcfce7; --no:#b91c1c; --no-soft:#fee2e2;
  --mod:#1a4791; --mod-soft:#dbe3f0;
  --shadow:0 14px 38px -16px rgba(12,46,107,.30);
  --shadow-sm:0 6px 16px -6px rgba(12,46,107,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:'Inter','PingFang TC','Apple LiGothic Medium','Microsoft JhengHei',sans-serif;font-size:20px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 16px 48px}
.en,.prompt.en,.opt.en .txt,.best.en,.alt.en,.ma.en,.mp.en{font-family:'Inter',sans-serif}

/* hero */
.hero{margin:0 -16px;padding:44px 22px 36px;background:linear-gradient(135deg,#0c2e6b 0%,#1a4791 55%,#4d6ba9 100%);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"🎧 🗂️ 🔍 👂 ✉️ 🌏";position:absolute;right:-6px;bottom:-8px;font-size:34px;opacity:.18;letter-spacing:6px;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.hero-in{max-width:728px;margin:0 auto}
.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h1{font-size:40px;line-height:1.25;margin:6px 0 10px;font-weight:800}
.lede{font-size:20px;opacity:.95}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-22px 0 18px;position:relative}
.stats div{background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);padding:14px 8px;text-align:center;border:1px solid var(--line)}
.stats b{display:block;font-size:28px;color:var(--blue-deep);font-weight:800}
.stats span{font-size:17px;color:var(--ink-soft)}

.quick{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:14px;border:0;font:inherit;font-size:20px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--mod);color:#fff;box-shadow:var(--shadow-sm)}
.btn.ghost{background:var(--mod-soft);color:var(--mod)}

.sec{font-size:24px;margin:30px 0 12px;font-weight:800}
.sec small{display:block;font-size:17px;font-weight:500;color:var(--ink-soft)}

/* module cards */
.mods{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.mods{grid-template-columns:1fr 1fr}body{font-size:21px}}
.mod{display:flex;flex-direction:column;gap:4px;padding:20px 20px 18px;border-radius:20px;text-decoration:none;background:linear-gradient(160deg,var(--s) 0%,#fff 75%);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.mod:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.mod-emoji{font-size:54px;line-height:1;margin-bottom:6px;transition:transform .3s}
.mod:hover .mod-emoji{transform:rotate(-8deg) scale(1.08)}
.mod-tag{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.mod-title{font-size:26px;font-weight:800;color:var(--ink)}
.mod-desc{font-size:18px;color:var(--ink-soft)}
.bar{display:block;height:8px;background:rgba(0,0,0,.07);border-radius:8px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:8px;transition:width .6s}
.mod-meta{font-size:17px;color:var(--ink-soft)}

.foot{margin-top:36px;padding:20px;border-radius:16px;background:var(--cream);font-size:18px}
.foot p+p{margin-top:8px}
.foot .small{font-size:17px;color:var(--ink-soft)}

/* top bar */
.bar-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:18px;font-weight:700}
.bar-top span:first-of-type{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{text-decoration:none;color:var(--mod);font-weight:700;min-width:64px}
.count{color:var(--ink-soft);font-weight:600}
.progress{height:6px;background:var(--mod-soft);margin:0 -16px}
.progress i{display:block;height:100%;background:var(--mod);transition:width .4s}

/* module page */
.mod-hero{text-align:center;padding:28px 6px 10px}
.mod-hero .big{font-size:80px;display:block;line-height:1.1}
.mod-hero h1{font-size:34px;margin-top:6px}
.mod-hero .en{color:var(--mod);font-weight:700;font-size:18px;letter-spacing:.04em;margin-bottom:8px}
.mod-hero p{color:var(--ink-soft)}
.mod-hero .btn{margin-top:18px;width:100%}
.sets{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.set{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .15s}
.set:active{transform:scale(.98)}
.set-emoji{font-size:38px;width:52px;text-align:center}
.set-body{flex:1;display:flex;flex-direction:column}
.set-title{font-size:21px;font-weight:700}
.set-en{font-size:17px;color:var(--ink-soft)}
.set-best{font-size:17px;font-weight:700;color:var(--mod);background:var(--mod-soft);padding:6px 12px;border-radius:999px}

/* question */
.qcard{margin-top:18px;padding:20px;border-radius:20px;background:var(--mod-soft);border:1px solid rgba(0,0,0,.04)}
.qmeta{font-size:17px;color:var(--ink-soft)}
.qmeta b{color:var(--mod)}
.prompt{font-size:24px;font-weight:700;line-height:1.5;margin:10px 0 14px}
.qtools{display:flex;flex-wrap:wrap;gap:10px}
.spk,.mic{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;padding:8px 14px;min-height:44px;background:#fff;color:var(--mod);box-shadow:var(--shadow-sm);cursor:pointer}
.mic{background:var(--mod);color:#fff}
.mic:disabled{opacity:.7}
.heard{margin-top:12px;padding:12px 14px;background:#fff;border-radius:12px;font-family:'Inter','PingFang TC',sans-serif;font-size:19px}
.heard span{color:var(--ink-soft);font-size:17px}
.heard small{font-size:17px;color:var(--ink-soft)}
.ask{font-size:18px;font-weight:700;color:var(--ink-soft);margin:20px 4px 10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:20px;line-height:1.5;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;animation:rise .35s ease both;animation-delay:var(--d);transition:border-color .15s,background .15s,transform .1s}
.opts.long .opt{font-size:19px}
.opt:active{transform:scale(.99)}
.opt .key{flex:none;width:32px;height:32px;border-radius:50%;background:var(--mod-soft);color:var(--mod);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-family:'Inter',sans-serif}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .key{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}

.fb{margin-top:18px;padding:20px;border-radius:20px;border:2px solid}
.fb.ok{border-color:var(--ok);background:#f4fbf6}
.fb.no{border-color:var(--no);background:#fdf6f6}
.verdict{font-weight:800;font-size:21px}
.fb.ok .verdict{color:var(--ok)}
.fb.no .verdict{color:var(--no)}
.best{font-size:21px;font-weight:700;margin:8px 0 10px}
.note{margin-top:14px;font-size:19px;line-height:1.65}
.alts{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.alts-h{font-size:17px;font-weight:700;color:var(--ink-soft)}
.alt{font-size:19px;margin-top:6px}
.alt .spk{padding:4px 10px;min-height:36px;margin-left:4px}
.next{width:100%;margin-top:18px}

/* result */
.result{text-align:center;padding:36px 10px 10px}
.score{font-size:72px;font-weight:800;color:var(--mod);line-height:1}
.score small{font-size:30px;color:var(--ink-soft)}
.msg{font-size:22px;margin:14px 0 22px}
.result-btns{display:flex;flex-direction:column;gap:10px}
.missed{display:flex;flex-direction:column;gap:10px}
.miss{padding:14px 16px;border-radius:14px;background:var(--cream)}
.mp{font-size:18px;color:var(--ink-soft)}
.ma{font-size:19px;font-weight:600;margin-top:4px}
.ma .spk{padding:4px 10px;min-height:36px}

/* motion */
.reveal{animation:rise .5s ease both;animation-delay:var(--d,0ms)}
.pop{animation:pop .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"><p style="padding:40px 0;text-align:center;color:#5a606e">載入中…</p></main>
<script src="app.js?v=1"></script>
<script defer src="/assets/js/voice.js"></script>
</body>
</html>
