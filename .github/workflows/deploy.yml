name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Shallow checkout (fetch-depth 1) — does NOT pull the large repo history,
      # which is what was timing out the legacy Pages build.
      - name: Checkout
        uses: actions/checkout@v4

      # Stage the site, excluding images no page references (.pages-exclude).
      # Those files stay in the repo but are kept out of the published artifact,
      # so the deployed site stays comfortably under Pages' 1GB limit.
      - name: Stage site (drop unreferenced assets)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='.pages-exclude' --exclude='tools' --exclude='worker' \
            --exclude-from='.pages-exclude' \
            ./ _site/

      # /assets/* is served with max-age=14400. Without a content hash in the URL
      # a returning visitor keeps the old CSS/JS for up to four hours, with no
      # symptom beyond "the change didn't happen". Stamping the staged copy means
      # production is always correct even if someone forgot to run the script.
      - name: Stamp asset URLs with content hashes
        run: python3 tools/stamp_assets.py --root _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
