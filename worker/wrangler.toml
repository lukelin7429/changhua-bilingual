name = "changhua-bilingual-photos-proxy"
main = "worker.js"
compatibility_date = "2026-08-07"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "bilingual-schools-media"

[[routes]]
pattern = "changhua-bilingual.org/schools/*"
zone_name = "changhua-bilingual.org"

# Mandarin pronunciation clips for /learn/ — served from R2 only, no origin copy.
[[routes]]
pattern = "changhua-bilingual.org/learn/audio/*"
zone_name = "changhua-bilingual.org"
